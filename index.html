<style>
:root {
  --radius: 1rem;
  --background: oklch(0.14 0.02 200);
  --foreground: oklch(0.97 0.01 180);
  --card: oklch(0.18 0.025 195);
  --primary: oklch(0.82 0.17 160);
  --primary-foreground: oklch(0.16 0.03 200);
  --secondary: oklch(0.24 0.03 195);
  --muted: oklch(0.22 0.025 195);
  --muted-foreground: oklch(0.72 0.03 190);
  --accent: oklch(0.72 0.22 320);
  --destructive: oklch(0.65 0.22 25);
  --warning: oklch(0.82 0.15 90);
  --border: oklch(0.32 0.05 170);
  --whatsapp: oklch(0.72 0.19 150);
  --glass-fill: color-mix(in oklab, white 12%, transparent);
  --glass-fill-strong: color-mix(in oklab, white 18%, transparent);
  --glass-line: color-mix(in oklab, white 16%, transparent);
  --glass-hi: color-mix(in oklab, white 22%, transparent);
  --gradient-page: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, white 6%, var(--background)) 0%, var(--background) 60%);
  --gradient-story: radial-gradient(circle at 30% 107%, oklch(0.96 0.09 95) 0%, oklch(0.96 0.09 95) 5%, oklch(0.68 0.2 30) 45%, oklch(0.6 0.24 330) 60%, oklch(0.5 0.24 265) 90%);
  --shadow-glow: 0 0 40px -8px color-mix(in oklab, var(--primary) 45%, transparent);
}
* { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--background); color: var(--foreground); font-family: "Outfit", ui-sans-serif, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.bg-page { min-height: 100vh; background-image: var(--gradient-page); background-color: var(--background); }
.wrap { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1.25rem 7rem; }
.ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
.ic-sm { width: 1rem; height: 1rem; flex-shrink: 0; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }

/* Botão "Planos" chamativo + borda do card girando */
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

@keyframes plans-pulse {
  0%, 100% { box-shadow: 0 0 14px -2px color-mix(in oklab, var(--primary) 70%, transparent), 0 0 0 0 color-mix(in oklab, var(--primary) 55%, transparent); }
  50% { box-shadow: 0 0 30px 2px color-mix(in oklab, var(--primary) 95%, transparent), 0 0 0 8px transparent; }
}

.plans-cta { position: relative; overflow: hidden; isolation: isolate; animation: plans-pulse 2s ease-in-out infinite; font-weight: 800; letter-spacing: .02em; }
.plans-cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none; background: linear-gradient(100deg, transparent 0%, rgb(255 255 255 / .25) 30%, rgb(255 255 255 / .9) 50%, rgb(255 255 255 / .25) 70%, transparent 100%); animation: plans-sweep 2s ease-in-out infinite; }
.glow-card { position: relative; box-shadow: 0 0 26px -10px color-mix(in oklab, var(--primary) 80%, transparent); }

/* ===================== Tema v2: mais vivo ===================== */
:root {
  --background: oklch(0.12 0.028 205);
  --card: oklch(0.17 0.032 200);
  --primary: oklch(0.85 0.19 158);
  --accent: oklch(0.72 0.24 330);
  --border: oklch(0.3 0.05 185);
  --gradient-brand: linear-gradient(135deg, oklch(0.89 0.19 150) 0%, oklch(0.81 0.17 182) 55%, oklch(0.73 0.16 215) 100%);
  --gradient-hot: linear-gradient(135deg, oklch(0.76 0.23 335), oklch(0.68 0.21 290));
  --shadow-glow: 0 0 44px -10px color-mix(in oklab, var(--primary) 60%, transparent);
  --gradient-page:
    radial-gradient(90% 46% at 12% -6%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 62%),
    radial-gradient(70% 42% at 104% 6%, color-mix(in oklab, var(--accent) 17%, transparent), transparent 64%),
    radial-gradient(90% 50% at 50% 112%, color-mix(in oklab, oklch(0.7 0.17 215) 14%, transparent), transparent 62%);
}
.bg-page { background-attachment: fixed; }

.btn-brand { background-image: var(--gradient-brand); font-weight: 700; position: relative; overflow: hidden; box-shadow: 0 10px 26px -10px color-mix(in oklab, var(--primary) 75%, transparent), inset 0 1px 0 rgb(255 255 255 / .38); transition: transform .12s, box-shadow .2s, filter .2s; }
.btn-brand:hover { filter: brightness(1.07); }
.btn-brand.big { padding: .95rem 2.25rem; font-size: 1.125rem; animation: glowpulse 2.8s ease-in-out infinite; }
@keyframes glowpulse { 0%, 100% { box-shadow: 0 10px 28px -10px color-mix(in oklab, var(--primary) 70%, transparent), inset 0 1px 0 rgb(255 255 255 / .38); } 50% { box-shadow: 0 14px 44px -6px color-mix(in oklab, var(--primary) 95%, transparent), inset 0 1px 0 rgb(255 255 255 / .38); } }
.btn-line { background: color-mix(in oklab, var(--card) 70%, transparent); border-color: color-mix(in oklab, var(--primary) 28%, var(--border)); transition: transform .12s, border-color .2s, background .2s; }
.btn-line:hover { border-color: var(--primary); background: color-mix(in oklab, var(--primary) 10%, var(--card)); }

.card { background-image: linear-gradient(160deg, color-mix(in oklab, white 7%, transparent), transparent 60%); border-color: color-mix(in oklab, var(--primary) 16%, var(--border)); box-shadow: 0 20px 44px -26px rgb(0 0 0 / .85), inset 0 1px 0 color-mix(in oklab, white 9%, transparent); }
.card h2 { font-weight: 700; letter-spacing: -.01em; }
.page-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }

.bal-card { background-image: radial-gradient(120% 150% at 100% 0%, color-mix(in oklab, var(--primary) 40%, transparent), transparent 55%), radial-gradient(90% 100% at 0% 100%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 60%), linear-gradient(150deg, color-mix(in oklab, white 12%, var(--card)), var(--card)); border: 1px solid color-mix(in oklab, var(--primary) 42%, transparent); }
.bal-card p[data-money] { font-size: 2.75rem !important; letter-spacing: -.03em; line-height: 1.1; background-image: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pill-glow { box-shadow: 0 8px 22px -10px color-mix(in oklab, var(--primary) 80%, transparent); }

.plan-row { border-radius: 1.1rem; transition: border-color .2s, box-shadow .2s, transform .12s, background .2s; }
.plan-row.static { background-image: linear-gradient(160deg, color-mix(in oklab, white 6%, transparent), transparent); }
.plan-row:not(.static):hover { border-color: color-mix(in oklab, var(--primary) 60%, var(--border)); }
.plan-row.sel { background: color-mix(in oklab, var(--primary) 10%, var(--card)); }

.field input, .field select, .input { background: color-mix(in oklab, white 4%, var(--background)); transition: box-shadow .15s, border-color .15s; }
.field input:focus, .field select:focus, .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 28%, transparent); }
.auth-card { background-image: linear-gradient(160deg, color-mix(in oklab, white 7%, transparent), transparent 55%); border-color: color-mix(in oklab, var(--primary) 30%, var(--border)); }
.stat { background-image: linear-gradient(160deg, color-mix(in oklab, var(--primary) 12%, transparent), transparent); border: 1px solid color-mix(in oklab, var(--primary) 16%, var(--border)); }
.stat .v { background-image: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.list > .li { padding: .85rem 0; }
.badge { border: 1px solid color-mix(in oklab, currentColor 22%, transparent); }

const hash53 = (text) => {
  let h1 = 0xdeadbeef;
  let h2 = 0x41c6ce57;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ code, 2654435761);
    h2 = Math.imul(h2 ^ code, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};

function canvas_signature() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 220;
    canvas.height = 40;
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(10, 5, 80, 25);
    ctx.fillStyle = '#069';
    ctx.fillText('aperta-o-play 🎮', 4, 8);
    return canvas.toDataURL();
  } catch { return ''; }
}

function first_touch() {
  try { return JSON.parse(localStorage.getItem('ap_touch') || '{}'); } catch { return {}; }
}

function capture_first_touch() {
  if (localStorage.getItem('ap_touch')) return;
  const q = new URLSearchParams(location.search);
  const touch = { utm_source: q.get('utm_source') || '', utm_medium: q.get('utm_medium') || '', utm_campaign: q.get('utm_campaign') || '', referrer: document.referrer || '', landing: location.pathname + location.search };
  try { localStorage.setItem('ap_touch', JSON.stringify(touch)); } catch {}
}

function client_info() {
  const nav = navigator;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const signature = [nav.userAgent, nav.language, screen.width, screen.height, screen.colorDepth, nav.hardwareConcurrency, nav.deviceMemory, tz, canvas_signature()].join('|');
  return { tz, scr: `${screen.width}x${screen.height}`, dpr: window.devicePixelRatio, plat: nav.platform, cores: nav.hardwareConcurrency, mem: nav.deviceMemory, touch: nav.maxTouchPoints, lang: nav.language, fp: hash53(signature), ...first_touch() };
}

const client_actions = new Set(['register', 'login', 'google_login']);

async function api(endpoint, body) {
  const token = state.user?.token;
  const extra = endpoint === API_DISCORD && client_actions.has(body.action) ? { client: client_info() } : {};
  const r = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(token ? { token, ...extra, ...body } : { ...extra, ...body }) });
  const data = await r.json();
  if (data?.code === 'auth' && state.user) { toast('Sessão expirada. Entre novamente.'); logout(); }
  return data;
}
const dc  = (body) => api(API_DISCORD, body);
const pay = (body) => api(API_PAY, body);
const chatapi = (body) => api(API_CHAT, body);

function toast(msg, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function copy_text(t, msg = 'Copiado!') {
  navigator.clipboard.writeText(t).then(() => toast(msg), () => toast('Não foi possível copiar.'));

function logo_html(size = 40, verified = false) {

    : '';
  return `<span class="ring" style="width:${size}px;height:${size}px"><span class="ring-in"><img src="${LOGO}" alt="Logo do Aperta o Play"></span>${check}</span>`;

function premium_html(compact = false) {
  const plan = state.user?.plan;
  if (!plan) return '';
  return `<span class="premium" title="Plano ativo de ${brl(plan)}"><span class="row" style="gap:.25rem">${icon('shield_check', 'ic-sm')}${compact ? 'Premium' : `Premium ativo · ${brl(plan)}`}</span></span>`;
}

function carousel_html() {
  const banners = state.banners;
  const slides = banners.length
    ? banners.map((b, i) => `<div class="slide" data-link="${esc(b.link || '')}" onclick="open_banner(this)"><img src="${esc(b.url)}" alt="Banner ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}"></div>`).join('')
    : `<div class="slide">${logo_html(56)}<p style="font-size:1.125rem;font-weight:700">Aperta o Play</p><p class="tiny" style="font-size:.75rem">Novidades em breve</p></div>`;
  const dots = banners.map((_, i) => `<button class="dot ${i === state.carousel_idx ? 'on' : ''}" onclick="carousel_go(${i})" aria-label="Ver banner ${i + 1}"><span></span></button>`).join('');
  const controls = banners.length > 1
    ? `<div class="car-ctl">
        <button class="btn-ghost-ic" onclick="carousel_prev()" aria-label="Banner anterior">${icon('chev_l')}</button>
        <div class="dots">${dots}</div>
        <div class="row">
          <button class="btn-ghost-ic" onclick="toggle_pause()" aria-label="${state.paused ? 'Continuar banners' : 'Pausar banners'}">${icon(state.paused ? 'play' : 'pause')}</button>
          <button class="btn-ghost-ic" onclick="carousel_next()" aria-label="Próximo banner">${icon('chev_r')}</button>
        </div>
      </div>`
    : '';
  return `<div class="carousel glass"><div class="track" id="carousel-track" style="transform:translateX(-${state.carousel_idx * 100}%)">${slides}</div></div>${controls}`;
}

function open_banner(el) {
  const link = el.dataset.link;
  if (/^https?:\/\//i.test(link)) window.open(link, '_blank', 'noopener');
}

async function load_banners() {
  const data = await dc({ action: 'get_banners' });
  state.banners = data.banners || [];
  state.carousel_idx = Math.min(state.carousel_idx, Math.max(state.banners.length - 1, 0));
  render_carousel_only();
}

function render_carousel_only() {
  const el = document.getElementById('carousel-container');
  if (!el) return;
  el.innerHTML = carousel_html();
  carousel_reset_timer();
}

function carousel_go(idx) {
  if (!state.banners.length) return;
  state.carousel_idx = (idx + state.banners.length) % state.banners.length;
  const track = document.getElementById('carousel-track');
  if (track) track.style.transform = `translateX(-${state.carousel_idx * 100}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === state.carousel_idx));
  carousel_reset_timer();
}

const carousel_next = () => carousel_go(state.carousel_idx + 1);
const carousel_prev = () => carousel_go(state.carousel_idx - 1);

function toggle_pause() {
  state.paused = !state.paused;
  render_carousel_only();
}

function carousel_reset_timer() {
  clearInterval(state.carousel_timer);
  if (state.banners.length < 2 || state.paused) return;
  state.carousel_timer = setInterval(() => { if (!document.hidden) carousel_next(); }, 5000);
}

function open_modal(html, on_close) {
  window._modal_on_close = on_close || null;
  document.getElementById('modal-root').innerHTML = `
    <div class="mask" onclick="close_modal()">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="x" onclick="close_modal()" aria-label="Fechar">${icon('x')}</button>
        ${html}
      </div>
    </div>`;
}

function close_modal() {
  const cb = window._modal_on_close;
  window._modal_on_close = null;
  document.getElementById('modal-root').innerHTML = '';
  if (cb) cb();
}

async function pick_avatar(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Escolha um arquivo de imagem.'); return; }
  toast('Enviando foto…', 10000);
  try {
    const bitmap = await createImageBitmap(file);
    const side = Math.min(bitmap.width, bitmap.height);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 384;
    canvas.getContext('2d').drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, 384, 384);
    const data = await dc({ action: 'upload_avatar', image_base64: canvas.toDataURL('image/jpeg', 0.86).split(',')[1] });
    if (data.error) { toast(data.error, 4500); return; }
    save_user(data.user);
    toast('Foto atualizada!');
    render();
  } catch {
    toast('Não foi possível ler essa imagem. Tente outra.', 4500);
  }
}

async function remove_avatar() {
  if (!confirm('Remover sua foto de perfil?')) return;
  const data = await dc({ action: 'remove_avatar' });
  if (data.error) { toast(data.error, 4000); return; }
  save_user(data.user);
  toast('Foto removida.');
  render();
}

function form_busy(btn_id, busy, label) {
  const btn = document.getElementById(btn_id);
  if (!btn) return;
  btn.disabled = busy;
  btn.innerHTML = busy ? '<span class="spinner"></span> Salvando…' : label;
}

async function save_profile(e) {
  e.preventDefault();
  const alert_box = document.getElementById('prof-alert');
  form_busy('pf-btn', true);
  const new_login = document.getElementById('pf-login').value.trim().toLowerCase();
  if (new_login && new_login !== (state.user.login || '')) {
    const r = await dc({ action: 'set_login', login: new_login });
    if (r.error) { form_busy('pf-btn', false, 'Salvar dados'); alert_box.innerHTML = `<div class="notice err">${esc(r.error)}</div>`; return; }
    save_user(r.user);
  }
  const body = { action: 'update_profile', city: document.getElementById('pf-city').value, birth: document.getElementById('pf-birth').value, bio: document.getElementById('pf-bio').value };
  const whatsapp = document.getElementById('pf-whatsapp').value.trim();
  if (whatsapp && whatsapp !== (state.user.whatsapp || '')) body.whatsapp = whatsapp;
  const data = await dc(body);
  form_busy('pf-btn', false, 'Salvar dados');
  if (data.error) { alert_box.innerHTML = `<div class="notice err">${esc(data.error)}</div>`; return; }
  save_user(data.user);
  toast('Perfil salvo!');
  render();
}

async function save_email(e) {
  e.preventDefault();
  const alert_box = document.getElementById('em-alert');
  form_busy('em-btn', true);
  const data = await dc({ action: 'change_email', new_email: document.getElementById('em-new').value, password: document.getElementById('em-pass').value });
  form_busy('em-btn', false, 'Trocar e-mail');

async function save_password(e) {
  e.preventDefault();
  const alert_box = document.getElementById('pw-alert');
  const next = document.getElementById('pw-new').value;
  if (next !== document.getElementById('pw-new2').value) { alert_box.innerHTML = '<div class="notice err">As senhas não são iguais</div>'; return; }

function fmt_phone(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d;
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
}

function load_gsi() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.id) return resolve();
    const el = document.createElement('script');
    el.src = 'https://accounts.google.com/gsi/client';
    el.async = true;
    el.onload = resolve;
    el.onerror = reject;
    document.head.appendChild(el);
  });
}

  google.accounts.id.initialize({ client_id: cfg.google_client_id, callback: google_done });

async function auth_submit(e, mode) {
  e.preventDefault();
  const email    = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-pass').value;
  const ref_code = document.getElementById('auth-ref')?.value.trim();
  const whatsapp = document.getElementById('auth-wa')?.value.replace(/\D/g, '');
  const login_name = document.getElementById('auth-login')?.value.trim().toLowerCase();

  if (!email || !password) { auth_err('Preencha todos os campos'); return; }
  if (mode !== 'login' && !/^[a-z0-9._-]{3,20}$/.test(login_name || '')) { auth_err('Escolha um login de 3 a 20 caracteres (letras, números, ponto, hífen ou _)'); return; }
  if (mode !== 'login' && (!whatsapp || whatsapp.length < 10)) { auth_err('Informe um WhatsApp válido com DDD'); return; }

  const btn = document.getElementById('auth-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const data = mode === 'login'
    ? await dc({ action: 'login', email, password })
    : await dc({ action: 'register', email, login: login_name, password, whatsapp, referral_code: ref_code });

  if (data.error) {
    auth_err(data.error);
    btn.disabled = false;
    btn.innerHTML = mode === 'login' ? 'Entrar' : 'Criar conta';
    return;
  }

  save_user(data.user);
  localStorage.removeItem('ap_ref');
  history.replaceState({}, '', '/');
  set_page('painel');
}

function fmt_cpf(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 14);
  if (d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}

  window._pix_payment_id = data.payment_id;

  open_modal(`
    <h3 class="modal-title">Pague ${brl(data.amount)} no Pix</h3>

    <button class="btn-line w-full mt-3" id="pix-check-btn" onclick="check_pix(true)">${icon('check', 'ic-sm')}Já paguei</button>
    <p class="muted center gap-2 mt-4"><span class="pulse-dot"></span>Aguardando pagamento…</p>`, stop_pix_poll);

  stop_pix_poll();
  let tries = 0;
  window._pix_timer = setInterval(() => {
    if (++tries > 225) { stop_pix_poll(); return; } // ~15 min
    check_pix(false);
  }, 4000);

async function check_pix(manual) {
  if (window._pix_checking) return;
  window._pix_checking = true;
  const btn = document.getElementById('pix-check-btn');
  if (manual && btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verificando…'; }

  let data = {};
  try {
    data = await pay({ action: 'check_payment', payment_id: window._pix_payment_id, email: state.user.email });
  } catch {}
  window._pix_checking = false;

  if (data.status === 'approved') {
    stop_pix_poll();
    toast('Pagamento confirmado! Plano ativado.');
    close_modal();
    const u = await dc({ action: 'get_user' });
    if (u.user) save_user(u.user);
    render();
    return;
  }
  if (manual && btn) {
    btn.disabled = false;
    btn.innerHTML = `${icon('check', 'ic-sm')}Já paguei`;
    toast('Pagamento ainda não identificado. Aguarde alguns segundos.');
  }
}

  const u = state.user;
  const min_w = Math.max(1, Number(cfg.min_withdraw) || 1);
  const max_w = Number(cfg.max_withdraw) || 0;
  const paused = cfg.withdrawals_open === false;
  const bal = Number(u.balance || 0);
  const auto = !!cfg.payouts;
  const saved = u.pix_key ? `${PIX_LABEL[u.pix_type] || u.pix_type} · ${mask_key(u.pix_key)}` : null;
  mount(shell('Saque Pix', `
    <section class="glass-strong">
      <p style="font-size:.875rem">Saldo disponível</p>
      <p style="margin-top:.5rem;font-size:2.25rem;font-weight:800">${brl(bal)}</p>
    </section>

    <form class="card" onsubmit="salvar_chave(event)">
      <h2>Minha chave Pix</h2>
      <p class="tiny mt-2" style="font-size:.75rem">${saved ? `Chave salva: <b>${esc(saved)}</b>. Preencha de novo para trocar.` : 'Salve a chave onde você quer receber.'}</p>
      <div id="chave-alert" class="mt-3"></div>
      <label class="field">Tipo de chave Pix
        <select id="chave-tipo" onchange="document.getElementById('chave-doc-wrap').style.display = ['cpf','cnpj'].includes(this.value) ? 'none' : 'block'">
          <option value="cpf" ${u.pix_type === 'CPF' ? 'selected' : ''}>CPF</option>
          <option value="cnpj" ${u.pix_type === 'CNPJ' ? 'selected' : ''}>CNPJ</option>
          <option value="email" ${u.pix_type === 'EMAIL' ? 'selected' : ''}>E-mail</option>
          <option value="phone" ${u.pix_type === 'PHONE' ? 'selected' : ''}>Telefone</option>
          <option value="random" ${u.pix_type === 'EVP' ? 'selected' : ''}>Chave aleatória</option>
        </select>
      </label>
      <label class="field">Chave Pix<input type="text" id="chave-valor" placeholder="${saved ? 'Deixe vazio para manter a chave salva' : 'Sua chave Pix'}" ${saved ? '' : 'required'}></label>
      <div id="chave-doc-wrap" style="display:${['CPF', 'CNPJ', undefined].includes(u.pix_type) ? 'none' : 'block'}">
        <label class="field">CPF do titular da chave<input type="text" id="chave-doc" inputmode="numeric" placeholder="000.000.000-00" maxlength="18" oninput="this.value = fmt_cpf(this.value)"></label>
      </div>
      <label class="row gap-3" style="margin-top:1rem;align-items:flex-start;font-size:.875rem">
        <input type="checkbox" id="chave-auto" ${u.auto_payout ? 'checked' : ''} style="margin-top:.2rem">
        <span>Receber minhas comissões direto no Pix, assim que alguém ativar pelo meu link${auto ? '' : ' <span class="tiny">(disponível quando o saque automático estiver ativo)</span>'}.</span>

      <div id="saque-alert" class="mt-3"></div>
      <p class="muted xs">Destino: <b>${saved ? esc(saved) : 'nenhuma chave salva'}</b></p>
      <p class="tiny" style="font-size:.75rem;margin-top:.35rem">Saque mínimo: <b>${brl(min_w)}</b>${max_w ? ` · máximo por saque: <b>${brl(max_w)}</b>` : ''}</p>
      ${paused ? '<div class="notice err mt-3">Os saques estão temporariamente pausados. Tente novamente mais tarde.</div>' : bal < min_w ? `<div class="notice mt-3">Seu saldo ainda é menor que o saque mínimo de ${brl(min_w)}.</div>` : ''}
      <label class="field">Valor<input type="text" id="saque-valor" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${bal >= min_w ? String(bal.toFixed(2)).replace('.', ',') : ''}"></label>

async function salvar_chave(e) {
  e.preventDefault();
  const alert_el = document.getElementById('chave-alert');
  const btn = document.getElementById('chave-btn');
  const key = document.getElementById('chave-valor').value.trim();
  const body = { action: 'update_profile', auto_payout: document.getElementById('chave-auto').checked };
  if (key) { body.pix_type = document.getElementById('chave-tipo').value; body.pix_key = key; body.owner_doc = document.getElementById('chave-doc').value; }
  else if (!state.user.pix_key) { alert_el.innerHTML = '<div class="notice err">Informe a sua chave Pix.</div>'; return; }
  btn.disabled = true;
  let data;
  try { data = await dc(body); } catch { data = { error: 'Sem conexão com o servidor. Verifique a internet e tente de novo.' }; }
  btn.disabled = false;
  if (data.error) { alert_el.innerHTML = `<div class="notice err">${esc(data.error)}</div>`; return; }
  save_user(data.user);
  toast('Chave Pix salva!');
  render_saque();
}

async function solicitar_saque(e) {
  e.preventDefault();
  const alert_el = document.getElementById('saque-alert');
  const fail = (msg) => { alert_el.innerHTML = `<div class="notice err">${msg}</div>`; };
  const btn = document.getElementById('saque-btn');
  if (btn.disabled) return;

  // aceita "10,50", "10.50" e "R$ 1.234,56"
  let raw = String(document.getElementById('saque-valor').value).trim().replace(/[R$\s]/g, '');
  if (raw.includes(',')) raw = raw.replace(/\./g, '').replace(',', '.');
  const valor = Math.round(Number(raw) * 100) / 100;
  if (!raw || !Number.isFinite(valor) || valor <= 0) { fail('Digite o valor que deseja sacar. Exemplo: 25,00'); return; }
  const cfg = await get_cfg();
  const min_w = Math.max(1, Number(cfg.min_withdraw) || 1);
  const max_w = Number(cfg.max_withdraw) || 0;
  const bal = Math.round(Number(state.user.balance || 0) * 100) / 100;
  if (valor < min_w) { fail(`O valor mínimo de saque é ${brl(min_w)}.`); return; }
  if (valor > bal) { fail(`Saldo insuficiente. Você tem ${brl(bal)} disponível.`); return; }
  if (max_w > 0 && valor > max_w) { fail(`O valor máximo por saque é ${brl(max_w)}.`); return; }

  alert_el.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando…';

  let data;
  try { data = await dc({ action: 'request_withdrawal', amount: valor }); }
  catch { data = { error: 'Não deu para confirmar o saque (conexão ou servidor demorou). Confira o histórico abaixo antes de tentar de novo, para não sacar duas vezes.' }; }

  btn.disabled = false;
  btn.innerHTML = 'Sacar agora';
  if (data.error) { fail(esc(data.error)); load_withdrawals(); return; }

  try { const fresh = await dc({ action: 'get_user' }); if (fresh.user) save_user(fresh.user); } catch {}
  const msg = {
    approved:   'Saque enviado! O Pix já foi para a sua conta.',
    processing: 'Saque em processamento. Você será pago em instantes.',
    pending:    'Saque solicitado! Será pago em até 24h.',
  }[data.status] || 'Saque solicitado!';
  render_saque().then(() => { document.getElementById('saque-alert').innerHTML = `<div class="notice ok">${msg}</div>`; });
}

async function load_withdrawals() {
  let data;
  try { data = await dc({ action: 'get_withdrawals' }); } catch { data = { error: true }; }
  const el = document.getElementById('saques-list');
  if (!el) return;
  if (data.error || !Array.isArray(data.withdrawals)) { el.innerHTML = '<p class="muted" style="padding:1rem 0;text-align:center">Não foi possível carregar o histórico agora.</p>'; return; }
  if (!data.withdrawals?.length) { el.innerHTML = '<p class="muted" style="padding:1rem 0;text-align:center">Nenhum saque ainda.</p>'; return; }
  const tone  = { pending: 'yellow', processing: 'yellow', approved: 'green', rejected: 'red' };
  const label = { pending: 'Pendente', processing: 'Processando', approved: 'Pago', rejected: 'Recusado' };
  el.innerHTML = [...data.withdrawals].sort((x, y) => new Date(y.created_at) - new Date(x.created_at)).map((w) => `
    <div class="li">
      <span class="avatar-ic">${icon('wallet', 'ic-sm')}</span>
      <div class="grow"><p class="name">${brl(w.amount)} · ${esc((w.pix_type || '').toUpperCase())}</p><p class="tiny">${fmt_date(w.created_at)}</p></div>
      <span class="badge ${tone[w.status] || 'yellow'}">${label[w.status] || esc(w.status)}</span>
    </div>`).join('');
}

function video_id(url) {
  const match = String(url || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return match ? match[1] : '';
}

function material_stats_html(list, downloads_label) {
  const total = (key) => list.reduce((sum, m) => sum + (m[key] || 0), 0);
  const top = list.reduce((best, m) => (!best || (m.downloads || 0) > (best.downloads || 0) ? m : best), null);
  const top_line = top && total('downloads') ? `<p class="muted xs mt-3">Mais usado: <b>${esc(top.title || 'Sem título')}</b></p>` : '';
  return `<div class="stat-grid">${stat_html(downloads_label, total('downloads'))}${stat_html('Compartilhamentos', total('shares'))}</div>${top_line}`;
}

function material_card(kind, m) {
  const is_banner = kind === 'banners';
  const vid = is_banner ? '' : video_id(m.url);
  const thumb = is_banner ? `<img src="${esc(m.url)}" alt="${esc(m.title || 'Banner')}" loading="lazy">` : (vid ? `<img src="https://img.youtube.com/vi/${vid}/hqdefault.jpg" alt="" loading="lazy">` : '');
  const veil = is_banner ? '' : `<span class="mat-play">${icon('play', 'ic').replace('fill="none"', 'fill="currentColor"')}</span>`;
  const main = is_banner
    ? `<button class="btn-brand" data-k="${kind}" data-id="${esc(m.id)}" onclick="download_material(this)">${icon('download', 'ic-sm')}Baixar</button>`
    : `<button class="btn-brand" data-k="${kind}" data-id="${esc(m.id)}" onclick="open_video(this)">${icon('play', 'ic-sm').replace('fill="none"', 'fill="currentColor"')}Assistir</button>`;
  return `
    <article class="mat">
      <span class="mat-media">${thumb}${veil}</span>
      <div class="mat-body">
        <p class="mat-title">${esc(m.title || (is_banner ? 'Banner' : 'Vídeo'))}</p>
        <div class="mat-stats"><span>${icon('download', 'ic-sm')}${m.downloads || 0}</span><span>${icon('share', 'ic-sm')}${m.shares || 0}</span></div>
        <div class="mat-actions">${main}<button class="mat-wa" data-k="${kind}" data-id="${esc(m.id)}" onclick="share_material(this)" aria-label="Compartilhar no WhatsApp">${wa_icon('ic-sm')}</button></div>
      </div>
    </article>`;
}

function find_material(btn) {
  return (state.materials[btn.dataset.k] || []).find((m) => m.id === btn.dataset.id);
}

function paint_materials(kind) {
  const box = document.getElementById('mat-box');
  if (!box) return;
  const list = state.materials[kind];
  if (!list.length) { box.innerHTML = '<p class="muted" style="padding:1rem 0;text-align:center">Nenhum material publicado ainda.</p>'; return; }
  box.innerHTML = kind === 'videos'
    ? `<div class="vid-list">${list.map(video_card).join('')}</div>`
    : `<div class="mat-grid">${list.map((m) => material_card(kind, m)).join('')}</div>`;
}

async function render_materials(kind) {
  const is_banner = kind === 'banners';
  const title = is_banner ? 'Galeria de banners' : 'Vídeos de divulgação';
  const hint = is_banner ? 'Baixe os banners ou envie direto no WhatsApp com o seu link.' : 'Assista, compartilhe e divulgue com o seu link de indicação.';
  mount(shell(title, `<p class="muted" style="margin-top:.5rem">${hint}</p>${state.user.plan ? '' : '<div class="notice mt-3">Ative seu plano para liberar o seu link e compartilhar os materiais.</div>'}<div id="mat-box" class="mt-4">${spinner_block()}</div>`));
  const data = await dc(is_banner ? { action: 'get_banners', all: true } : { action: 'get_videos' });
  const list = (is_banner ? data.banners : data.videos) || [];
  state.materials[kind] = is_banner ? list.slice().reverse() : list;
  paint_materials(kind);
}

function track_material(kind, m, metric) {
  m[metric] = (m[metric] || 0) + 1;
  paint_materials(kind);
  dc({ action: 'track_material', msg_id: m.id, metric });
}

async function download_material(btn) {
  const m = find_material(btn);
  if (!m) return;
  track_material('banners', m, 'downloads');
  try {
    const blob = await (await fetch(m.url)).blob();
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href;
    a.download = `${(m.title || 'banner').replace(/[^\w-]+/g, '_')}.${blob.type.split('/')[1] || 'jpg'}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 4000);
  } catch {
    window.open(m.url, '_blank', 'noopener');
  }
}

function open_video(btn) {
  const m = find_material(btn);
  if (!m) return;
  track_material('videos', m, 'downloads');
  window.open(m.url, '_blank', 'noopener');
}

async function share_material(btn) {
  const m = find_material(btn);
  if (!m) return;
  if (!state.user.plan) { toast('Ative seu plano para liberar o seu link de indicação.'); return; }
  const kind = btn.dataset.k;
  const link = ref_url(state.user.referral_code);
  const text = `🔥 ${m.title || 'Aperta o Play'}\nEntre pelo meu link: ${link}${kind === 'videos' ? `\n${m.url}` : ''}`;
  track_material(kind, m, 'shares');
  if (kind === 'banners' && navigator.canShare) {
    try {
      const blob = await (await fetch(m.url)).blob();
      const file = new File([blob], `banner.${blob.type.split('/')[1] || 'jpg'}`, { type: blob.type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}


// ---------- notificações + sons de venda ----------
const notif = { unread: 0, items: [], known: null, timer: null, busy: false };
const NOTIF_TONES = [
  { id: 'caixa', label: 'Caixa registradora' },
  { id: 'moeda', label: 'Moeda' },
  { id: 'sino',  label: 'Sino' },
  { id: 'ding',  label: 'Ding' },
  { id: 'sucesso', label: 'Sucesso' },
];
const notif_key = (name) => `ap_${name}_${(state.user?.email || '').toLowerCase()}`;
const notif_store = (name, fallback) => { try { return JSON.parse(localStorage.getItem(notif_key(name)) ?? 'null') ?? fallback; } catch { return fallback; } };
const notif_save = (name, value) => { try { localStorage.setItem(notif_key(name), JSON.stringify(value)); } catch {} };
const notif_prefs = () => ({ sound: true, tone: 'caixa', volume: 0.8, desktop: false, ...notif_store('notif_prefs', {}) });

let audio_ctx = null;
function audio_unlock() {
  try {
    audio_ctx = audio_ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (audio_ctx.state === 'suspended') audio_ctx.resume();
  } catch {}
}
['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, audio_unlock, { passive: true }));

function play_tone(id, volume) {
  audio_unlock();
  const ctx = audio_ctx;
  if (!ctx) return;
  const vol = Math.max(0, Math.min(1, volume ?? notif_prefs().volume));
  const t0 = ctx.currentTime + 0.02;
  const master = ctx.createGain();
  master.gain.value = vol;
  master.connect(ctx.destination);
  // uma nota: oscilador com ataque rápido e queda exponencial
  const note = (freq, at, dur, type = 'sine', peak = 0.5) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0 + at);
    gain.gain.setValueAtTime(0.0001, t0 + at);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(t0 + at);
    osc.stop(t0 + at + dur + 0.05);
  };
  if (id === 'caixa') {
    // "tchim": estalo curto de ruído + dois sinos agudos
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    g.gain.value = 0.35;
    src.connect(g);
    g.connect(master);
    src.start(t0);
    [[2093, 0.06], [2637, 0.14]].forEach(([f, at]) => { note(f, at, 0.9, 'sine', 0.45); note(f * 2.4, at, 0.5, 'sine', 0.12); });
  } else if (id === 'moeda') {
    note(988, 0, 0.12, 'square', 0.22);
    note(1319, 0.09, 0.55, 'square', 0.22);
  } else if (id === 'sino') {
    [[1, 0.5], [2.01, 0.25], [2.76, 0.18], [5.4, 0.08]].forEach(([m, pk]) => note(660 * m, 0, 1.6, 'sine', pk));
  } else if (id === 'ding') {
    note(1175, 0, 0.7, 'sine', 0.5);
    note(1760, 0, 0.35, 'sine', 0.15);
  } else if (id === 'sucesso') {
    [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.11, 0.45, 'triangle', 0.4));
  }
}

function preview_tone(id) {
  play_tone(id, notif_prefs().volume);
}

function notif_update_badge() {
  document.querySelectorAll('.nbadge').forEach((el) => {
    el.textContent = notif.unread > 9 ? '9+' : String(notif.unread);
    el.classList.toggle('on', notif.unread > 0);
  });
}

function notif_alert(title, body, tag = 'ap-sale') {
  const prefs = notif_prefs();
  if (!prefs.desktop || !('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, icon: '/icons/icon-192.png', badge: '/icons/icon-192.png', tag, renotify: true };
  try {
    if (navigator.serviceWorker?.ready) navigator.serviceWorker.ready.then((reg) => reg.showNotification(title, opts)).catch(() => new Notification(title, opts));
    else new Notification(title, opts);
  } catch {}
}

async function refresh_balance() {
  const r = await dc({ action: 'get_user' });
  if (r?.user) { save_user(r.user); if (state.page === 'painel') render(); }
}

async function notif_tick() {
  if (!state.user || notif.busy || document.hidden) return;
  notif.busy = true;
  try {
    const data = await dc({ action: 'poll_notifications' });
    if (!data.sales) return;
    const ids = data.sales.map((s) => s.id);
    let known = notif.known || notif_store('notif_known', null);
    if (!known) {
      // primeira vez neste aparelho: o histórico não toca som nem vira "novo"
      notif.known = ids;
      notif_save('notif_known', ids);
      if (notif_store('notif_seen', null) === null) notif_save('notif_seen', Date.now());
      return;
    }
    const fresh = data.sales.filter((s) => !known.includes(s.id)).sort((a, b) => a.at - b.at);
    notif.known = known = [...new Set([...ids, ...known])].slice(0, 200);
    notif_save('notif_known', known);
    const seen = notif_store('notif_seen', 0);
    notif.unread = state.page === 'notificacoes' ? 0 : data.sales.filter((s) => s.at > seen).length;
    notif_update_badge();
    if (!fresh.length) return;
    notif.items = [...fresh.map((s) => ({ ...s, is_new: true })), ...notif.items];
    const total = fresh.reduce((sum, s) => sum + (s.amount || 0), 0);
    const msg = fresh.length > 1 ? `${fresh.length} vendas novas! +${brl(total)}` : `Venda confirmada! +${brl(total)}`;
    toast(`💰 ${msg}`, 6000);
    const prefs = notif_prefs();
    if (prefs.sound) play_tone(prefs.tone, prefs.volume);
    notif_alert('Aperta o Play', msg);
    if (state.page === 'notificacoes') paint_notifications();
    refresh_balance();
  } finally {
    notif.busy = false;
  }
}

function notif_start() {
  if (notif.timer) return;
  setTimeout(notif_tick, 2500);
  notif.timer = setInterval(notif_tick, 25000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) notif_tick(); });
}

function notif_text(n) {
  if (n.type === 'sale') return { icon: 'banknote', title: 'Venda confirmada', text: `Você ganhou ${brl(n.amount)} de comissão${n.plan ? ` (plano de ${brl(n.plan)})` : ''}.` };
  if (n.type === 'referral') return { icon: 'users', title: 'Novo afiliado na sua rede', text: `${n.name} se cadastrou pelo seu link.` };
  if (n.type === 'withdrawal') {
    const label = { pending: 'pendente', processing: 'em processamento', approved: 'pago', rejected: 'recusado' }[n.status] || n.status;
    return { icon: 'wallet', title: 'Saque', text: `Saque de ${brl(n.amount)}: ${label}.` };
  }
  return { icon: 'bell', title: n.title || 'Aviso', text: n.text || '' };
}

function paint_notifications() {
  const box = document.getElementById('notif-list');
  if (!box) return;
  const seen = notif_store('notif_seen', 0);
  if (!notif.items.length) { box.innerHTML = '<p class="muted" style="padding:1rem 0;text-align:center">Nenhuma notificação ainda.</p>'; return; }
  box.innerHTML = notif.items.map((n) => {
    const t = notif_text(n);
    return `<div class="n-item ${n.is_new || n.at > seen ? 'new' : ''}"><span class="avatar-ic">${icon(t.icon, 'ic-sm')}</span><div class="grow" style="min-width:0"><p class="n-title">${esc(t.title)}</p><p class="n-text">${esc(t.text)}</p><p class="tiny" style="margin-top:.25rem">${new Date(n.at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</p></div></div>`;
  }).join('');
}

function notif_pref_set(name, value) {
  notif_save('notif_prefs', { ...notif_prefs(), [name]: value });
}

async function toggle_desktop(el) {
  if (!el.checked) { notif_pref_set('desktop', false); return; }

  if (perm !== 'granted') { toast('Permissão negada. Ative nas configurações do navegador.', 4500); el.checked = false; return; }
  notif_pref_set('desktop', true);

  const seen_before = notif_store('notif_seen', 0);
  const data = await dc({ action: 'get_notifications' });
  if (state.page !== 'notificacoes') return;
  const polled_new = notif.items.filter((n) => n.is_new);
  const merged = (data.items || []).map((n) => ({ ...n, is_new: polled_new.some((p) => p.id === n.id) || (seen_before && n.at > seen_before) }));
  notif.items = merged;
  paint_notifications();
  notif.unread = 0;
  notif_update_badge();
  notif_save('notif_seen', Date.now());
  const known = notif.known || notif_store('notif_known', null);
  if (known) { const all = [...new Set([...merged.filter((n) => n.type === 'sale').map((n) => n.id), ...known])].slice(0, 200); notif.known = all; notif_save('notif_known', all); }
}

async function share_promo(btn) {
  const m = video_by_btn(btn);
  if (!m || plan_required()) return;
  const link = promo_url(m);
  const text = `🔥 ${m.title || 'Aperta o Play'}\nEntre pelo meu link: ${link}`;
  const enc = encodeURIComponent;
  track_material('videos', m, 'shares');
  switch (btn.dataset.t) {
    case 'wa': window.open('https://wa.me/?text=' + enc(text), '_blank', 'noopener'); break;
    case 'fb': window.open('https://www.facebook.com/sharer/sharer.php?u=' + enc(link), '_blank', 'noopener'); break;
    case 'tg': window.open(`https://t.me/share/url?url=${enc(link)}&text=${enc(m.title || 'Aperta o Play')}`, '_blank', 'noopener'); break;
    case 'status':
      if (navigator.share) { try { await navigator.share({ text, url: link }); } catch {} } else copy_text(link, 'Link copiado! Cole no seu Status do WhatsApp.');
      break;
    case 'ig': copy_text(link, 'Link copiado! Cole na bio ou no story do Instagram.'); break;
    case 'tt': copy_text(link, 'Link copiado! Cole na bio do TikTok.'); break;
  }
}

async function download_video(btn) {
  const m = video_by_btn(btn);
  if (!m) return;
  track_material('videos', m, 'downloads');
  try {
    const blob = await (await fetch(m.url)).blob();
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href;
    a.download = `${(m.title || 'video').replace(/[^\w-]+/g, '_')}.${blob.type.split('/')[1] || 'mp4'}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 4000);
  } catch {
    window.open(m.url, '_blank', 'noopener');
  }
}

const pad = (n, size = 2) => String(n).padStart(size, '0');
const to_ms = (v) => (typeof v === 'number' ? v : Date.parse(v) || 0);
const brt_parts = (ms) => { const d = new Date(ms - 10800000); return { d: pad(d.getUTCDate()), m: pad(d.getUTCMonth() + 1), y: d.getUTCFullYear(), h: pad(d.getUTCHours()), i: pad(d.getUTCMinutes()), s: pad(d.getUTCSeconds()), ms: pad(d.getUTCMilliseconds(), 3) }; };
const fmt_sec = (v) => { const ms = to_ms(v); if (!ms) return '—'; const p = brt_parts(ms); return `${p.d}/${p.m}/${p.y} ${p.h}:${p.i}:${p.s}`; };
const fmt_precise = (v) => { const ms = to_ms(v); if (!ms) return '—'; const p = brt_parts(ms); return `${p.d}/${p.m}/${p.y} ${p.h}:${p.i}:${p.s}.${p.ms} (Brasília)`; };
const fmt_ago = (v) => {
  const diff = Math.max(0, Date.now() - to_ms(v));
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  if (days > 0) return `há ${days} d ${hours} h`;
  if (hours > 0) return `há ${hours} h ${minutes} min`;
  return `há ${minutes} min ${Math.floor((diff % 60000) / 1000)} s`;
};
const adm_label = (key) => adm_labels[key] || key.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());

async function adm_call(action, input = {}, sudo_password) {
  const body = { action, token: state.user?.token, ...input };
  const sudo = sudo_password || window._admin_pass;
  if (sudo) body.sudo_password = sudo;
  let data;
  try {
    const r = await fetch(API_ADMIN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    data = await r.json();
  } catch {
    data = { error: 'Falha de rede ou resposta inválida do servidor' };
  }
  if (data.code === 'auth' && state.user) { toast('Sessão expirada. Entre novamente.'); logout(); }
  if (data.code === 'sudo') window._admin_pass = '';
  return data;
}

const adm_badge_tone = (v) => {
  const t = String(v).toLowerCase();
  if (['approved', 'active', 'ok', 'sim', 'paid', 'admin', 'owner'].includes(t)) return 'green';
  if (['pending', 'processing', 'suspended', 'warn', 'support', 'finance'].includes(t)) return 'yellow';
  if (['rejected', 'banned', 'failed', 'refunded', 'cancelled', 'expired', 'denied', 'missing'].includes(t)) return 'red';
  return '';
};
const adm_badge = (v) => `<span class="badge ${adm_badge_tone(v)}">${esc(v)}</span>`;
const adm_avatar = (r, size = 32) => avatar_html({ login: r.login, name: r.name, email: r.email, avatar: r.avatar }, size);
const adm_user_link = (email) => `<a class="adm-ulink" data-e="${esc(email)}" onclick="adm_open_user(this.dataset.e)">${esc(email)}</a>`;
const adm_btn = (label, id, preset = {}, cls = 'adm-mini') => adm.by_id[id] ? `<button class="${cls}" data-a="${esc(id)}" data-p="${esc(JSON.stringify(preset))}" onclick="adm_act(this)">${label}</button>` : '';
const adm_copy_btn = (text) => `<button class="adm-mini" data-c="${esc(text)}" onclick="copy_text(this.dataset.c)">copiar</button>`;

function adm_fmt(value, key = '', scope = '', parent = '') {
  if (value === null || value === undefined || value === '') return '<span class="tiny">—</span>';
  if (typeof value === 'boolean') return value ? 'sim' : 'não';
  if (typeof value === 'number') {
    if (/(_ms|_ts|^ts|^msg_at)$/.test(key) && value > 1e11) return `<span title="${esc(fmt_precise(value))}">${esc(fmt_sec(value))}</span>`;
    if (/^(by_|sales_by)/.test(parent)) return esc(String(value));
    if (parent === 'revenue_by_plan' || adm_money_keys.has(key) || (key === 'total' && /^(finance|commissions|withdrawals|payments)\./.test(scope))) return brl(value);
    return esc(String(value));
  }
  if (typeof value === 'string') {
    if (/(_at|^at)$/.test(key) && Date.parse(value)) return `<span title="${esc(fmt_precise(value))}">${esc(fmt_sec(value))}</span>`;
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return adm_user_link(value);
    if (key === 'status' || key === 'state') return adm_badge(value);
    if (key === 'ip') return `<a class="adm-ulink" data-ip="${esc(value)}" onclick="adm_ip_lookup(this.dataset.ip)">${esc(value)}</a>`;
    return esc(value);
  }
  return null;
}

function adm_bars(series) {
  const max = Math.max(...series.map((s) => Number(s.value) || 0), 1);
  return `<div class="adm-bars">${series.map((s) => `<i style="height:${Math.max(2, ((Number(s.value) || 0) / max) * 100)}%" title="${esc(s.label)}: ${esc(s.value)}"></i>`).join('')}</div><div class="row between tiny"><span>${esc(series[0]?.label)}</span><span>${esc(series[series.length - 1]?.label)}</span></div>`;
}

function adm_hbars(rows, money_mode) {
  const max = Math.max(...rows.map((r) => Number(r.value) || 0), 1);
  return `<div class="adm-hbars">${rows.map((r) => `<div class="adm-hb"><span class="n">${adm_fmt(String(r.label)) ?? esc(r.label)}</span><span class="b"><i style="width:${Math.max(1, ((Number(r.value) || 0) / max) * 100)}%"></i></span><span class="v">${money_mode ? brl(r.value) : esc(r.value)}${r.percent !== undefined ? ` <small>${esc(r.percent)}%</small>` : ''}${r.conversion !== undefined ? ` <small>conv. ${esc(r.conversion)}%</small>` : ''}</span></div>`).join('')}</div>`;
}

function adm_heatmap(grid, labels) {
  const max = Math.max(...grid.flat(), 1);
  const head = `<tr><th></th>${Array.from({ length: 24 }, (_, h) => `<th>${h}</th>`).join('')}</tr>`;
  const body = grid.map((row, d) => `<tr><th>${esc(labels[d])}</th>${row.map((v, h) => `<td title="${esc(labels[d])} ${h}h: ${v}" style="background:color-mix(in oklab,var(--primary) ${Math.round((v / max) * 90)}%,transparent)">${v || ''}</td>`).join('')}</tr>`).join('');
  return `<div class="adm-table-wrap adm-heat"><table class="adm-t">${head}${body}</table></div>`;
}

function adm_auto_columns(rows) {
  const keys = [];
  for (const row of rows.slice(0, 25)) for (const k of Object.keys(row)) if (!keys.includes(k) && k !== 'msg_at') keys.push(k);
  return keys.slice(0, 14).map((key) => ({ key, label: adm_label(key) }));
}

function adm_cell(row, column, scope) {
  if (column.render) return column.render(row);
  const rendered = adm_fmt(row[column.key], column.key, scope);
  return rendered ?? `<code class="tiny">${esc(JSON.stringify(row[column.key]).slice(0, 160))}</code>`;
}

function adm_table(rows, columns, opts = {}) {
  if (!rows.length) return '<p class="muted" style="padding:1rem 0">Nenhum registro.</p>';
  const head = columns.map((c) => {
    const sort_name = opts.sortable?.[c.key];
    const arrow = sort_name && adm.filters[opts.action]?.sort === sort_name ? (adm.filters[opts.action].dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th ${sort_name ? `class="sortable" data-s="${esc(sort_name)}" data-a="${esc(opts.action)}" onclick="adm_sort(this)"` : ''}>${esc(c.label ?? adm_label(c.key))}${arrow}</th>`;
  }).join('');
  const select_head = opts.selectable ? '<th><input type="checkbox" onclick="adm_select_all(this)"></th>' : '';
  const body = rows.map((row) => `<tr>${opts.selectable ? `<td><input type="checkbox" class="adm-sel" value="${esc(row.email)}"></td>` : ''}${columns.map((c) => `<td>${adm_cell(row, c, opts.scope || '')}</td>`).join('')}</tr>`).join('');
  return `<div class="adm-table-wrap"><table class="adm-t"><thead><tr>${select_head}${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function adm_render(value, key = '', scope = '', depth = 0, parent = '') {
  const simple = adm_fmt(value, key, scope, parent);
  if (simple !== null) return simple;
  if (Array.isArray(value)) {
    if (!value.length) return '<span class="tiny">vazio</span>';
    if (value.every((v) => v === null || typeof v !== 'object')) return value.map((v) => adm_fmt(v, key, scope, parent)).join(', ');
    if (key === 'series' && value.every((v) => 'label' in v && 'value' in v && Object.keys(v).length === 2)) return adm_bars(value);
    if (value.every((v) => v && 'label' in v && 'value' in v && Object.keys(v).length <= 4)) return adm_hbars(value, /^(finance|commissions)\./.test(scope) && key !== 'buckets');
    return adm_table(value.slice(0, 500), adm_auto_columns(value), { scope });
  }
  if (key === 'grid') return '';
  const entries = Object.entries(value).filter(([k]) => k !== 'download' && k !== 'labels' && !(depth === 0 && k === 'ok'));
  if (value.grid && value.labels) return adm_heatmap(value.grid, value.labels);
  return `<dl class="adm-dl">${entries.map(([k, v]) => `<div><dt>${esc(adm_label(k))}</dt><dd>${k === 'grid' ? adm_heatmap(v, value.labels) : adm_render(v, k, scope, depth + 1, key)}</dd></div>`).join('')}</dl>`;
}

function adm_download(file) {
  const blob = new Blob([file.content], { type: file.mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = file.filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function adm_modal_wide(html) {
  open_modal(html);
  document.querySelector('#modal-root .modal')?.classList.add('wide');
}

function adm_field_html(f, value) {
  const v = value !== undefined ? value : f.default;
  const req = f.required ? 'required' : '';
  const name = `name="${esc(f.name)}"`;
  if (f.type === 'checkbox') return `<label class="field adm-check"><input type="checkbox" ${name} ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label>`;
  if (f.type === 'select') return `<label class="field">${esc(f.label)}<select ${name} ${req}>${f.options.map((o) => { const ov = typeof o === 'object' ? o.value : o; const ol = typeof o === 'object' ? o.label : o; return `<option value="${esc(ov)}" ${String(v ?? '') === String(ov) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select></label>`;
  if (f.type === 'textarea' || f.type === 'list') return `<label class="field">${esc(f.label)}<textarea class="input" rows="3" ${name} ${req}>${esc(Array.isArray(v) ? v.join('\n') : v ?? '')}</textarea></label>`;
  const type = { email: 'email', password: 'password', number: 'number', date: 'date', datetime: 'datetime-local' }[f.type] || 'text';
  const extra = f.type === 'number' ? 'step="any"' : f.type === 'password' ? 'autocomplete="new-password"' : '';
  return `<label class="field">${esc(f.label)}<input type="${type}" ${name} value="${esc(v ?? '')}" ${req} ${extra}${f.max ? ` maxlength="${f.max}"` : ''}></label>`;
}

function adm_read_form(form, spec, preset = {}) {
  const input = { ...preset };
  for (const f of spec.fields) {
    if (preset[f.name] !== undefined) continue;
    const el = form.elements[f.name];
    if (!el) continue;
    if (f.type === 'checkbox') input[f.name] = el.checked;
    else if (f.type === 'datetime') input[f.name] = el.value ? new Date(el.value).toISOString() : '';
    else input[f.name] = el.value;
  }
  return input;
}

function adm_act(el) {
  adm_action(el.dataset.a, JSON.parse(el.dataset.p || '{}'));
}

function adm_action(id, preset = {}, after, defaults = {}) {
  const spec = adm.by_id[id];
  if (!spec) { toast('Seu cargo não permite esta função'); return; }
  adm.preset = preset;
  adm.after = after || null;
  const fields = spec.fields.filter((f) => preset[f.name] === undefined);
  const who = preset.email ? `<p class="tiny" style="text-align:center;margin-top:.5rem;word-break:break-all">${esc(preset.email)}</p>` : '';
  open_modal(`
    <form onsubmit="adm_submit(event, '${esc(id)}')">
      <h3 class="modal-title">${esc(spec.label)}</h3>
      ${spec.description ? `<p class="muted mt-2" style="text-align:center">${esc(spec.description)}</p>` : ''}
      ${who}
      ${fields.map((f) => adm_field_html(f, defaults[f.name])).join('')}
      ${spec.sudo ? `<label class="field">Sua senha de administrador<input type="password" name="__sudo" autocomplete="current-password" required value="${esc(window._admin_pass || '')}"></label>` : ''}
      <div id="adm-form-err"></div>
      <button class="${spec.danger ? 'btn-bad' : 'btn-brand'} w-full mt-5" style="padding:.75rem;border-radius:9999px">${spec.read ? 'Executar' : 'Confirmar'}</button>
    </form>`);
}

async function adm_submit(e, id) {
  e.preventDefault();
  const spec = adm.by_id[id];
  const form = e.target;
  const button = form.querySelector('button:last-of-type');
  const input = adm_read_form(form, spec, adm.preset);
  const sudo = form.elements.__sudo?.value;
  button.disabled = true;
  const label = button.textContent;
  button.innerHTML = '<span class="spinner"></span>';
  const data = await adm_call(id, input, sudo);
  if (data.error) {
    document.getElementById('adm-form-err').innerHTML = `<div class="notice err mt-3">${esc(data.error)}</div>`;
    button.disabled = false;
    button.textContent = label;
    return;
  }
  if (sudo) window._admin_pass = sudo;
  adm_done(id, data);
}

function adm_done(id, data) {
  const spec = adm.by_id[id];
  const after = adm.after;
  close_modal();
  if (data.download) adm_download(data.download);
  if (data.token && data.email) { adm_impersonate(data); return; }
  if (data.password) { adm_modal_wide(`<h3 class="modal-title">Senha temporária</h3><p class="muted mt-2" style="text-align:center">${esc(data.notice || '')}</p><div class="code-box mt-3" style="font-size:1.25rem;text-align:center;user-select:all">${esc(data.password)}</div><button class="btn-brand w-full mt-4" data-c="${esc(data.password)}" onclick="copy_text(this.dataset.c)">Copiar</button>`); return; }
  if (spec.read) { adm_show_output(spec, data); return; }
  const extra = Object.fromEntries(Object.entries(data).filter(([k]) => !['ok', 'user', 'download'].includes(k)));
  if (data.failed?.length || Object.keys(extra).length > 2) adm_modal_wide(`<h3 class="modal-title">Resultado</h3><div class="mt-3">${adm_render(extra, '', id)}</div>`);
  else toast(data.download ? 'Arquivo gerado' : 'Concluído');
  if (after) after(data);
  else adm_refresh();
}

function adm_show_output(spec, data) {
  const box = document.getElementById('adm-output');
  const html = `<h3 class="adm-h">${esc(spec.label)}</h3>${adm_render(data, '', spec.id)}`;
  if (box) { box.innerHTML = html; box.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  adm_modal_wide(html);
}

function adm_refresh() {
  adm_go(adm.view, adm.param);
}

async function adm_show_call(id, input) {
  const spec = adm.by_id[id];
  adm_modal_wide(`<div class="center">${spinner_block()}</div>`);
  const data = await adm_call(id, input);
  if (data.error) { adm_modal_wide(`<div class="notice err">${esc(data.error)}</div>`); return; }
  adm_modal_wide(`<h3 class="modal-title">${esc(spec?.label || id)}</h3><div class="mt-3">${adm_render(data, '', id)}</div>`);
}

const adm_ip_lookup = (ip) => adm_show_call('security.ip_lookup', { ip });
const adm_open_user = (email) => { close_modal(); adm_go('user', email); };

function adm_impersonate(data) {
  sessionStorage.setItem('ap_admin_backup', JSON.stringify(state.user));
  state.user = { email: data.email, token: data.token };
  dc({ action: 'get_user' }).then((r) => {
    state.user = { ...(r.user || {}), email: data.email, token: data.token };
    set_page('painel');
  });
}

function adm_stop_impersonation() {
  const backup = sessionStorage.getItem('ap_admin_backup');
  sessionStorage.removeItem('ap_admin_backup');
  if (backup) state.user = JSON.parse(backup);
  set_page('admin');
}

function render_imp_bar() {
  const backup = sessionStorage.getItem('ap_admin_backup');
  if (!backup || !state.user) return;
  const bar = document.createElement('div');
  bar.className = 'imp-bar';
  bar.innerHTML = `<span>Você está vendo a conta de <b>${esc(state.user.email)}</b></span><button onclick="adm_stop_impersonation()">Voltar ao admin</button>`;
  document.getElementById('app').appendChild(bar);
}

function adm_tabbed(el, tabs, start) {
  const id = `t${Math.random().toString(36).slice(2, 8)}`;
  el.innerHTML = `<div class="adm-tabs" id="${id}">${tabs.map((t) => `<button data-t="${t.id}">${t.label}</button>`).join('')}</div><div id="${id}c"></div>`;
  const select = (tab_id) => {
    el.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset.t === tab_id));
    tabs.find((t) => t.id === tab_id).render(document.getElementById(`${id}c`));
  };
  el.querySelectorAll(`#${id} button`).forEach((b) => { b.onclick = () => select(b.dataset.t); });
  select(start || tabs[0].id);
}

const adm_paging = new Set(['page', 'per_page', 'sort', 'dir']);

function adm_panel(el, action, opts = {}) {
  const spec = adm.by_id[action];
  if (!spec) { el.innerHTML = '<div class="notice err">Seu cargo não permite esta função.</div>'; return; }
  const base = Object.fromEntries(spec.fields.filter((f) => f.default !== undefined).map((f) => [f.name, f.default]));
  adm.filters[action] = { ...base, ...(opts.preset || {}), ...(adm.filters[action] || {}) };
  adm.list_opts[action] = opts;
  const fields = spec.fields.filter((f) => !adm_paging.has(f.name) && opts.preset?.[f.name] === undefined);
  const form = fields.length && !opts.hide_form ? `<form class="adm-filters" id="f_${esc(action)}" onsubmit="adm_apply(event, '${esc(action)}')">${fields.map((f) => adm_field_html(f, adm.filters[action][f.name])).join('')}<div class="adm-filter-actions"><button class="btn-ok">${spec.read ? 'Aplicar' : 'Executar'}</button><button type="button" class="btn-line rect" onclick="adm_reset('${esc(action)}')">Limpar</button></div></form>` : '';
  el.innerHTML = `${opts.toolbar ? `<div class="adm-toolbar">${opts.toolbar}</div>` : ''}${form}<div id="p_${esc(action)}"></div>`;
  const needs_input = spec.fields.some((f) => f.required && (adm.filters[action][f.name] === undefined || adm.filters[action][f.name] === ''));
  if (needs_input) document.getElementById(`p_${action}`).innerHTML = '<p class="muted" style="padding:1rem 0">Preencha os campos e execute.</p>';
  else adm_load(action);
}

function adm_apply(e, action) {
  e.preventDefault();
  const spec = adm.by_id[action];
  const input = adm_read_form(e.target, { fields: spec.fields.filter((f) => !adm_paging.has(f.name)) }, adm.list_opts[action]?.preset || {});
  adm.filters[action] = { ...adm.filters[action], ...input, page: 1 };
  adm_load(action);
}

function adm_reset(action) {
  delete adm.filters[action];
  adm_panel(document.getElementById(`p_${action}`).parentElement, action, adm.list_opts[action]);
}

async function adm_load(action) {
  const opts = adm.list_opts[action] || {};
  const box = document.getElementById(`p_${action}`);
  if (!box) return;
  box.innerHTML = spinner_block();
  const data = await adm_call(action, adm.filters[action]);
  if (!document.getElementById(`p_${action}`)) return;
  if (data.error) { box.innerHTML = `<div class="notice err mt-3">${esc(data.error)}</div>`; return; }
  if (data.download) adm_download(data.download);
  if (Array.isArray(data.rows) && data.total !== undefined && data.pages !== undefined) {
    const columns = opts.columns || adm_auto_columns(data.rows);
    const pager = `<div class="row between adm-pager"><span class="muted">${data.total} registro(s) · página ${data.page} de ${data.pages}</span><span class="row gap-2"><button class="adm-mini" ${data.page <= 1 ? 'disabled' : ''} data-a="${esc(action)}" data-d="-1" onclick="adm_page(this)">← anterior</button><button class="adm-mini" ${data.page >= data.pages ? 'disabled' : ''} data-a="${esc(action)}" data-d="1" onclick="adm_page(this)">próxima →</button></span></div>`;
    box.innerHTML = `${pager}${adm_table(data.rows, columns, { ...opts, action, scope: action })}${data.rows.length > 12 ? pager : ''}${data.notice ? `<p class="tiny mt-3">${esc(data.notice)}</p>` : ''}${data.total_diff !== undefined ? `<p class="muted mt-3">Diferença total: <b>${brl(data.total_diff)}</b></p>` : ''}`;
    return;
  }
  box.innerHTML = opts.render ? opts.render(data) : adm_render(data, '', action);
}

function adm_page(el) {
  const f = adm.filters[el.dataset.a];
  f.page = Math.max(1, (f.page || 1) + Number(el.dataset.d));
  adm_load(el.dataset.a);
}

function adm_sort(el) {
  const f = adm.filters[el.dataset.a];
  f.dir = f.sort === el.dataset.s && f.dir !== 'asc' ? 'asc' : 'desc';
  f.sort = el.dataset.s;
  f.page = 1;
  adm_load(el.dataset.a);
}

function adm_select_all(box) {
  document.querySelectorAll('.adm-sel').forEach((c) => { c.checked = box.checked; });
}

function adm_selected_emails() {
  return [...document.querySelectorAll('.adm-sel:checked')].map((c) => c.value);
}

function adm_bulk() {
  const emails = adm_selected_emails();
  if (!emails.length) { toast('Marque ao menos um usuário na tabela'); return; }
  adm_action('users.bulk', { emails }, () => { toast('Ação em massa concluída'); adm_refresh(); });
}

async function adm_quick(id, input) {
  const data = await adm_call(id, input);
  if (data.error) { toast(data.error); return; }
  if (data.download) { adm_download(data.download); toast(`${data.count ?? ''} registro(s) exportados`); }
}

function adm_card(title, body, extra = '') {
  return `<section class="adm-card ${extra}">${title ? `<h2>${title}</h2>` : ''}${body}</section>`;
}

function adm_kv(rows) {
  return `<dl class="adm-dl">${rows.filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd>${v ?? '<span class="tiny">—</span>'}</dd></div>`).join('')}</dl>`;
}

function adm_kpi(label, value, sub, view) {
  return `<button class="adm-kpi" ${view ? `onclick="adm_go('${view}')"` : ''}><span class="label">${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
}

function adm_search(query) {
  if (!query.trim()) return;
  adm_go('search', query.trim());
}

const adm_user_columns = [
  { key: 'email', label: 'Usuário', render: (r) => `<span style="display:flex;align-items:center;gap:.5rem">${adm_avatar(r, 34)}<span style="min-width:0">${adm_user_link(r.email)}${r.role ? ` ${adm_badge(r.role)}` : ''}${r.login ? `<br><span class="tiny">@${esc(r.login)}</span>` : ''}</span></span>` },
  { key: 'plan', label: 'Plano', render: (r) => r.plan ? `<span class="badge green">R$ ${r.plan}</span>` : '<span class="tiny">—</span>' },
  { key: 'balance', label: 'Saldo', render: (r) => brl(r.balance) },
  { key: 'state', label: 'Situação', render: (r) => adm_badge(r.state) + (r.withdraw_blocked ? ' <span class="badge yellow">saque bloq.</span>' : '') },
  { key: 'created_ms', label: 'Criada em', render: (r) => `<span title="${esc(fmt_precise(r.created_ms))}">${esc(fmt_sec(r.created_ms))}</span>` },
  { key: 'whatsapp', label: 'WhatsApp' },
  { key: 'reg_ip', label: 'IP cadastro', render: (r) => adm_fmt(r.reg_ip, 'ip') },
  { key: 'reg_country', label: 'Local', render: (r) => esc([r.reg_city, r.reg_country].filter(Boolean).join(', ') || '—') },
  { key: 'reg_device', label: 'Aparelho' },

    zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('drag'); if (e.dataTransfer.files[0]) handle_banner_file(e.dataTransfer.files[0]); });
  },

  functions: (el) => {
    const groups = {};
    for (const spec of adm.catalog) (groups[spec.group] = groups[spec.group] || []).push(spec);
    el.innerHTML = `
      <h1 class="page-title">Todas as funções <span class="muted">(${adm.catalog.length})</span></h1>
      <input class="input" id="fn-filter" placeholder="Filtrar funções… (ex: senha, banir, saldo, csv)" oninput="adm_filter_functions(this.value)" style="max-width:32rem">
      <div id="adm-output" class="adm-card" style="display:none"></div>
      ${Object.entries(groups).map(([group, specs]) => `<section class="adm-fn-group"><h2 class="adm-h">${esc(group)} <span class="muted">${specs.length}</span></h2><div class="adm-grid fn">${specs.map((s) => `<button class="adm-fn" data-id="${esc(s.id)}" data-q="${esc(`${s.id} ${s.label} ${s.description}`.toLowerCase())}" onclick="adm_run_function(this.dataset.id)"><span class="t">${esc(s.label)}</span><span class="d">${esc(s.description || s.id)}</span><span class="tags">${s.read ? '<i>leitura</i>' : '<i class="w">altera dados</i>'}${s.sudo ? '<i class="w">pede senha</i>' : ''}${s.danger ? '<i class="d">sensível</i>' : ''}</span></button>`).join('')}</div></section>`).join('')}`;
  },
};

function adm_filter_functions(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.adm-fn').forEach((b) => { b.style.display = !q || b.dataset.q.includes(q) ? '' : 'none'; });
}

function adm_run_function(id) {
  const spec = adm.by_id[id];
  const out = document.getElementById('adm-output');
  if (out) out.style.display = '';
  const needs_form = spec.fields.some((f) => f.required) || spec.sudo || !spec.read;
  if (needs_form) { adm_action(id); return; }
  adm_call(id, Object.fromEntries(spec.fields.filter((f) => f.default !== undefined).map((f) => [f.name, f.default]))).then((d) => {
    if (d.error) { toast(d.error); return; }
    adm_done(id, d);
  });
}

function adm_go(view, param = null) {
  document.body.classList.remove('adm-menu');
  adm.view = view;
  adm.param = param;
  document.querySelectorAll('.adm-nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === (view === 'user' || view === 'search' ? 'users' : view)));
  const el = document.getElementById('adm-view');
  if (!el) return;
  window.scrollTo(0, 0);
  (adm_views[view] || adm_views.dashboard)(el, param);
}

async function open_add_money() {
  if (!adm.by_id['users.add_money']) {
    const d = await adm_call('catalog');
    if (d.error) { toast(d.error); return; }
    adm.catalog = d.actions;
    adm.role = d.role;
    adm.by_id = Object.fromEntries(d.actions.map((a) => [a.id, a]));
  }
  if (!adm.by_id['users.add_money']) { toast('Seu cargo não permite esta função'); return; }
  adm_action('users.add_money', {}, async (data) => {
    const r = await dc({ action: 'get_user' });
    if (r?.user) save_user(r.user);
    toast(`Saldo adicionado! Novo saldo: ${brl(data.after)}`);
    set_page(state.page);
  }, { email: state.user.email });
}

async function render_admin() {
  mount(`<div style="padding:4rem 0" class="center">${spinner_block()}</div>`);
  const data = await adm_call('catalog');
  if (data.error) { mount(shell('Administração', `<div class="notice err">${esc(data.error)}</div>`)); return; }
  adm.catalog = data.actions;
  adm.role = data.role;
  adm.by_id = Object.fromEntries(data.actions.map((a) => [a.id, a]));
