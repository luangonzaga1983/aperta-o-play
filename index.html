<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperta o Play</title>
<style>
:root {
  --bg: #0a0a10;
  --surface: #13131e;
  --surface2: #1c1c2a;
  --border: #2a2a3d;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --accent-glow: rgba(124,58,237,0.35);
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --gold: #fbbf24;
  --text: #f0f0fa;
  --muted: #7070a0;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── CARROSSEL ── */
.carousel-wrap {
  position: relative; width: 100%; background: #000; overflow: hidden;
  border-bottom: 2px solid var(--accent);
}
.carousel-track { display: flex; transition: transform 0.5s cubic-bezier(.77,0,.18,1); will-change: transform; }
.carousel-slide {
  min-width: 100%; position: relative; cursor: pointer;
  aspect-ratio: 16/7;
}
.carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.carousel-slide-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a0a3a 0%, #0d0d1f 100%);
  font-size: 1.1rem; color: var(--muted);
}
.carousel-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
.carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); border: none; cursor: pointer; transition: all 0.2s; padding: 0; }
.carousel-dot.active { background: var(--accent2); width: 22px; border-radius: 4px; }
.carousel-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff;
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  backdrop-filter: blur(4px);
}
.carousel-arrow:hover { background: var(--accent); }
.carousel-arrow.left { left: 10px; }
.carousel-arrow.right { right: 10px; }

/* ── LAYOUT ── */
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
.card + .card { margin-top: 12px; }
.page { padding-bottom: 90px; }

/* ── TIPO ── */
h1 { font-size: 1.5rem; font-weight: 800; }
h2 { font-size: 1rem; font-weight: 700; }
.muted { color: var(--muted); font-size: 0.85rem; }
.label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: 8px; font-size: 0.88rem; font-weight: 700;
  cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s; width: 100%;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--accent) 0%, #5b21b6 100%); color: #fff; box-shadow: 0 4px 20px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { opacity: 0.9; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-gold { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; font-weight: 800; }
.btn-sm { padding: 7px 14px; font-size: 0.78rem; width: auto; }

/* ── INPUTS ── */
input, select, textarea {
  width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.88rem; outline: none; transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.input-group { margin-bottom: 13px; }
.input-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--muted); }

/* ── BADGES ── */
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
.badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
.badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
.badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
.badge-purple { background: rgba(168,85,247,.15); color: var(--accent2); }
.badge-gold   { background: rgba(251,191,36,.15); color: var(--gold); }

/* ── NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 20px; z-index: 100;
  backdrop-filter: blur(10px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; cursor: pointer; color: var(--muted); font-size: 0.68rem;
  border: none; background: none; transition: color 0.15s;
}
.nav-item.active { color: var(--accent2); }
.nav-icon { font-size: 1.25rem; }

/* ── BALANCE CARD ── */
.balance-card {
  background: linear-gradient(135deg, #1a0a3a 0%, #0d0718 100%);
  border: 1px solid rgba(124,58,237,0.4);
  border-radius: var(--r); padding: 22px; margin-bottom: 12px; position: relative; overflow: hidden;
}
.balance-card::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.3) 0%, transparent 70%);
}
.balance-value { font-size: 2rem; font-weight: 900; color: #fff; }
.balance-label { color: rgba(255,255,255,0.5); font-size: 0.75rem; margin-bottom: 4px; }

/* ── PLAN CARDS ── */
.plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plan-card {
  background: var(--surface2); border: 2px solid var(--border); border-radius: 10px;
  padding: 14px 8px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; text-align: center;
  position: relative; overflow: hidden;
}
.plan-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.plan-card.selected { border-color: var(--accent2); background: rgba(124,58,237,0.12); }
.plan-card.selected::after {
  content: '✓'; position: absolute; top: 6px; right: 8px;
  color: var(--accent2); font-size: 0.8rem; font-weight: 800;
}
.plan-price { font-size: 1.3rem; font-weight: 900; color: #fff; }
.plan-sub { font-size: 0.65rem; color: var(--muted); }
.plan-commission { font-size: 0.72rem; color: var(--green); margin-top: 5px; font-weight: 700; }

/* ── QR ── */
.qr-wrap { text-align: center; padding: 16px 0; }
.qr-wrap img { width: 190px; height: 190px; border-radius: 10px; border: 3px solid var(--accent); }
.pix-code {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-size: 0.7rem; word-break: break-all; color: var(--muted); margin-top: 10px; cursor: pointer;
}

/* ── LIST ── */
.list-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }

/* ── ALERT ── */
.alert { padding: 11px 14px; border-radius: 8px; font-size: 0.83rem; margin: 8px 0; }
.alert-error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
.alert-success { background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.3);  color: #86efac; }
.alert-info    { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.3); color: #c4b5fd; }

/* ── PAGE HEADER ── */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.avatar {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #5b21b6);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; cursor: pointer; flex-shrink: 0;
}

/* ── REFERRAL ── */
.referral-box {
  background: var(--surface2); border: 1px dashed rgba(168,85,247,0.4); border-radius: 8px;
  padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer;
  transition: border-color 0.2s;
}
.referral-box:hover { border-color: var(--accent2); }
.referral-url { font-size: 0.78rem; color: var(--accent2); flex: 1; word-break: break-all; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200;
  display: flex; align-items: flex-end; backdrop-filter: blur(4px);
}
.modal-box {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 20px;
  width: 100%; max-height: 88vh; overflow-y: auto;
  border-top: 1px solid var(--border);
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }

/* ── AUTH ── */
.auth-wrap { min-height: 100vh; display: flex; flex-direction: column; }
.auth-hero { flex-shrink: 0; }
.auth-body { flex: 1; padding: 24px 16px 32px; max-width: 480px; margin: 0 auto; width: 100%; }
.tab-switch { display: flex; background: var(--surface2); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 9px; border: none; background: none; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
.tab-btn.active { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; font-weight: 700; }

/* ── UPLOAD ZONE ── */
.upload-zone {
  border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center;
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent2); background: rgba(124,58,237,0.05); }
.upload-zone input { display: none; }
.upload-preview { width: 100%; border-radius: 8px; margin-top: 12px; max-height: 180px; object-fit: cover; }

/* ── BANNER ADMIN GRID ── */
.banner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.banner-thumb { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 16/7; }
.banner-thumb img { width: 100%; height: 100%; object-fit: cover; }
.banner-thumb-del {
  position: absolute; top: 6px; right: 6px; background: rgba(239,68,68,0.9);
  border: none; color: #fff; border-radius: 6px; cursor: pointer; padding: 4px 8px; font-size: 0.75rem;
}

/* ── SPINNER ── */
.spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
.spinner-lg { width: 36px; height: 36px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { display: flex; align-items: center; justify-content: center; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 11px 20px; border-radius: 10px; font-size: 0.83rem; z-index: 999;
  opacity: 0; transition: opacity 0.2s, transform 0.2s; white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── GLOW LINES ── */
.neon-line { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); border-radius: 1px; margin: 16px 0; }

@media (max-width: 360px) { .plan-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
const API_DISCORD = '/api/discord';
const API_ASSAS   = '/api/assas';

const PLANS = [
  { price: 25,  commission: 10,  label: 'Básico' },
  { price: 50,  commission: 25,  label: 'Pro' },
  { price: 100, commission: 50,  label: 'Premium' },
];

const state = {
  user: JSON.parse(localStorage.getItem('ap_user') || 'null'),
  page: 'home',
  banners: [],
  carousel_idx: 0,
  carousel_timer: null,
  selected_plan: null,
};

// ── API ──────────────────────────────────────────────────────────────────────

async function api(endpoint, body) {
  const r = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
const dc = (body) => api(API_DISCORD, body);
const as = (body) => api(API_ASSAS, body);

// ── UTILS ────────────────────────────────────────────────────────────────────

function brl(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }
function fmt_date(s) { return new Date(s).toLocaleDateString('pt-BR'); }

function save_user(u) { state.user = u; localStorage.setItem('ap_user', JSON.stringify(u)); }
function logout() { state.user = null; localStorage.removeItem('ap_user'); state.page = 'home'; render(); }

function toast(msg, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function copy_text(t) { navigator.clipboard.writeText(t).then(() => toast('Copiado! 📋')); }

function ref_url(code) { return `${location.origin}/?ref=${code}`; }

function set_page(p) { state.page = p; render(); }

// ── CAROUSEL ─────────────────────────────────────────────────────────────────

async function load_banners() {
  const data = await dc({ action: 'get_banners' });
  state.banners = data.banners || [];
  render_carousel_only();
}

function carousel_html(banners) {
  if (!banners.length) {
    return `<div class="carousel-wrap" style="aspect-ratio:16/7">
      <div style="width:100%;height:100%;background:linear-gradient(135deg,#1a0a3a,#0d0d1f);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
        <div style="font-size:2.5rem">▶️</div>
        <div style="color:var(--muted);font-size:0.9rem">Aperta o Play</div>
      </div>
    </div>`;
  }

  const slides = banners.map((b, i) => `
    <div class="carousel-slide" onclick="${b.link ? `window.open('${b.link}','_blank')` : ''}" style="${b.link ? 'cursor:pointer' : 'cursor:default'}">
      <img src="${b.url}" alt="Banner ${i+1}" loading="${i === 0 ? 'eager' : 'lazy'}">
    </div>`).join('');

  const dots = banners.map((_, i) => `
    <button class="carousel-dot ${i === state.carousel_idx ? 'active' : ''}" onclick="carousel_go(${i})"></button>`).join('');

  return `
    <div class="carousel-wrap" id="carousel">
      <div class="carousel-track" id="carousel-track" style="transform:translateX(-${state.carousel_idx * 100}%)">
        ${slides}
      </div>
      ${banners.length > 1 ? `
        <button class="carousel-arrow left" onclick="carousel_prev()">‹</button>
        <button class="carousel-arrow right" onclick="carousel_next()">›</button>
        <div class="carousel-dots">${dots}</div>` : ''}
    </div>`;
}

function carousel_go(idx) {
  state.carousel_idx = Math.max(0, Math.min(idx, state.banners.length - 1));
  const track = document.getElementById('carousel-track');
  if (track) track.style.transform = `translateX(-${state.carousel_idx * 100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === state.carousel_idx));
  carousel_reset_timer();
}

function carousel_next() { carousel_go((state.carousel_idx + 1) % state.banners.length); }
function carousel_prev() { carousel_go((state.carousel_idx - 1 + state.banners.length) % state.banners.length); }

function carousel_start() {
  carousel_reset_timer();
}

function carousel_reset_timer() {
  clearInterval(state.carousel_timer);
  if (state.banners.length > 1)
    state.carousel_timer = setInterval(carousel_next, 4500);
}

function render_carousel_only() {
  const el = document.getElementById('carousel-container');
  if (el) {
    el.innerHTML = carousel_html(state.banners);
    if (state.banners.length > 1) carousel_start();
  }
}

// ── NAV ──────────────────────────────────────────────────────────────────────

function nav_html(active) {
  const is_admin = state.user?.is_admin;
  const items = [
    { id: 'home',      icon: '🏠', label: 'Início' },
    ...(state.user ? [
      { id: 'painel',    icon: '📊', label: 'Painel' },
      { id: 'indicados', icon: '👥', label: 'Indicados' },
      { id: 'saque',     icon: '💸', label: 'Saque' },
    ] : []),
    ...(is_admin ? [{ id: 'admin', icon: '🔧', label: 'Admin' }] : []),
  ];
  return `<nav class="nav">${items.map(i => `
    <button class="nav-item ${active === i.id ? 'active' : ''}" onclick="set_page('${i.id}')">
      <span class="nav-icon">${i.icon}</span>${i.label}
    </button>`).join('')}</nav>`;
}

// ── RENDER PRINCIPAL ─────────────────────────────────────────────────────────

function render() {
  clearInterval(state.carousel_timer);
  switch (state.page) {
    case 'home':      render_home(); break;
    case 'painel':    state.user ? render_painel() : render_home(); break;
    case 'indicados': state.user ? render_indicados() : render_home(); break;
    case 'saque':     state.user ? render_saque() : render_home(); break;
    case 'admin':     state.user?.is_admin ? render_admin() : render_home(); break;
    default:          render_home();
  }
}

// ── HOME ─────────────────────────────────────────────────────────────────────

function render_home() {
  state.page = 'home';
  document.getElementById('app').innerHTML = `
    ${nav_html('home')}
    <div id="carousel-container">${carousel_html(state.banners)}</div>
    <div class="container page" style="padding-top:20px">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:3rem;margin-bottom:8px">▶️</div>
        <h1 style="font-size:1.8rem;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Aperta o Play</h1>
        <p class="muted" style="margin-top:8px">A plataforma de afiliados que paga de verdade</p>
      </div>

      <div class="neon-line"></div>

      <div class="card" style="margin-bottom:12px">
        <h2 style="margin-bottom:14px;text-align:center">💰 Tabela de comissões</h2>
        ${PLANS.map(p => `
          <div class="list-item">
            <div>
              <div style="font-weight:700">${p.label} · ${brl(p.price)}/mês</div>
              <div class="muted">Por cada indicado ativado</div>
            </div>
            <span class="badge badge-green" style="font-size:0.85rem">+${brl(p.commission)}</span>
          </div>`).join('')}
      </div>

      ${state.user ? `
        <button class="btn btn-primary" onclick="set_page('painel')">📊 Ir para meu painel</button>
      ` : `
        <button class="btn btn-gold" style="margin-bottom:10px" onclick="open_auth('register')">🚀 Criar conta grátis</button>
        <button class="btn btn-secondary" onclick="open_auth('login')">Já tenho conta — Entrar</button>
      `}
    </div>

    <div id="auth-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div class="modal-handle"></div>
        <div id="auth-modal-content"></div>
      </div>
    </div>`;

  if (state.banners.length > 1) carousel_start();
  load_banners();
}

// ── AUTH MODAL ───────────────────────────────────────────────────────────────

function open_auth(mode) {
  document.getElementById('auth-modal').style.display = 'flex';
  render_auth_form(mode);
}

function close_auth() {
  document.getElementById('auth-modal').style.display = 'none';
}

function render_auth_form(mode) {
  const ref = new URLSearchParams(location.search).get('ref') || '';
  document.getElementById('auth-modal-content').innerHTML = `
    <div class="tab-switch">
      <button class="tab-btn ${mode === 'login' ? 'active' : ''}" onclick="render_auth_form('login')">Entrar</button>
      <button class="tab-btn ${mode === 'register' ? 'active' : ''}" onclick="render_auth_form('register')">Cadastrar</button>
    </div>
    <div id="auth-alert"></div>
    <div class="input-group">
      <label>E-mail</label>
      <input type="email" id="auth-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="input-group">
      <label>Senha</label>
      <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}">
    </div>
    ${mode === 'register' ? `
      <div class="input-group">
        <label>Código de indicação (opcional)</label>
        <input type="text" id="auth-ref" value="${ref}" placeholder="Código">
      </div>` : ''}
    <button class="btn btn-primary" onclick="auth_submit('${mode}')" style="margin-bottom:10px">
      ${mode === 'login' ? 'Entrar' : 'Criar conta'}
    </button>
    <button class="btn btn-secondary" onclick="close_auth()">Cancelar</button>`;
}

async function auth_submit(mode) {
  const email    = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-pass').value;
  const ref_code = document.getElementById('auth-ref')?.value.trim();

  if (!email || !password) { auth_err('Preencha todos os campos'); return; }

  const btn = document.querySelector('#auth-modal-content .btn-primary');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const data = mode === 'login'
    ? await dc({ action: 'login', email, password })
    : await dc({ action: 'register', email, password, referral_code: ref_code });

  if (data.error) {
    auth_err(data.error);
    btn.disabled = false;
    btn.innerHTML = mode === 'login' ? 'Entrar' : 'Criar conta';
    return;
  }

  save_user(data.user);
  history.replaceState({}, '', '/');
  close_auth();
  state.page = 'painel';
  render();
}

function auth_err(msg) {
  document.getElementById('auth-alert').innerHTML = `<div class="alert alert-error">${msg}</div>`;
}

function select_plan(price) {

  document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));

async function open_pix() {
  if (!state.selected_plan) { toast('Selecione um plano primeiro'); return; }
  document.getElementById('pix-modal').style.display = 'flex';
  document.getElementById('pix-modal-content').innerHTML = `
    <h2 style="margin-bottom:16px">⚡ Gerando PIX…</h2>
    <div class="center" style="padding:40px"><div class="spinner spinner-lg"></div></div>`;

  const data = await as({ action: 'create_pix', email: state.user.email, plan_price: state.selected_plan });

  if (data.error) {
    document.getElementById('pix-modal-content').innerHTML = `
      <div class="alert alert-error">${data.error}</div>
      <button class="btn btn-secondary" style="margin-top:10px" onclick="close_pix()">Fechar</button>`;
    return;
  }

  window._pix_assas_id = data.assas_id;
  document.getElementById('pix-modal-content').innerHTML = `
    <h2 style="margin-bottom:4px">PIX · ${brl(data.amount)}</h2>
    <p class="muted" style="margin-bottom:16px;font-size:0.8rem">Escaneie com o app do banco ou copie o código</p>
    <div class="qr-wrap">
      <img src="data:image/png;base64,${data.qr_base64}" alt="QR PIX">
    </div>
    <div class="pix-code" onclick="copy_text('${data.qr_code}')">
      ${data.qr_code}
      <div class="muted" style="margin-top:4px;font-size:0.68rem">📋 Toque para copiar</div>
    </div>
    <button class="btn btn-success" style="margin-top:14px" onclick="check_pix()">✅ Já paguei</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="close_pix()">Fechar</button>`;
}

function close_pix() { document.getElementById('pix-modal').style.display = 'none'; }

async function check_pix() {
  const btn = event.target;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verificando…';
  const data = await as({ action: 'check_payment', assas_id: window._pix_assas_id, email: state.user.email });
  if (data.status === 'approved') {
    toast('Pagamento confirmado! 🎉');
    close_pix();
    const u = await dc({ action: 'get_user', email: state.user.email });
    if (u.user) save_user(u.user);
    render();
    return;
  }
  btn.disabled = false; btn.innerHTML = '✅ Já paguei';
  toast('Pagamento ainda não identificado. Aguarde alguns segundos.');
}

function render_saque() {
  document.getElementById('app').innerHTML = `
    ${nav_html('saque')}
    <div class="container page">
      <div class="page-header"><h1>💸 Saque</h1></div>
      <div class="balance-card">
        <div class="balance-label">Saldo disponível</div>
        <div class="balance-value">${brl(state.user.balance)}</div>
      </div>
      <div class="card">
        <h2 style="margin-bottom:14px">Solicitar via PIX</h2>
        <div id="saque-alert"></div>
        <div class="input-group">
          <label>Valor</label>
          <input type="number" id="saque-valor" placeholder="0,00" min="1" max="${state.user.balance}" step="0.01">
        </div>
        <div class="input-group">
          <label>Tipo de chave PIX</label>
          <select id="saque-tipo">
            <option value="cpf">CPF</option>
            <option value="cnpj">CNPJ</option>
            <option value="email">E-mail</option>
            <option value="phone">Telefone</option>
            <option value="random">Chave aleatória</option>
          </select>
        </div>
        <div class="input-group">
          <label>Chave PIX</label>
          <input type="text" id="saque-chave" placeholder="Sua chave PIX">
        </div>
        <button class="btn btn-primary" id="saque-btn" onclick="solicitar_saque()">Solicitar saque</button>
      </div>
      <div class="card">
        <h2 style="margin-bottom:12px">📋 Histórico de saques</h2>
        <div id="saques-list"><div class="center" style="padding:20px"><div class="spinner"></div></div></div>
      </div>
    </div>`;

  load_withdrawals();
}

async function solicitar_saque() {
  const valor = parseFloat(document.getElementById('saque-valor').value);
  const tipo  = document.getElementById('saque-tipo').value;
  const chave = document.getElementById('saque-chave').value.trim();
  const alert_el = document.getElementById('saque-alert');

  if (!valor || valor <= 0)              { alert_el.innerHTML = `<div class="alert alert-error">Valor inválido</div>`; return; }
  if (valor > state.user.balance)        { alert_el.innerHTML = `<div class="alert alert-error">Saldo insuficiente</div>`; return; }
  if (!chave)                            { alert_el.innerHTML = `<div class="alert alert-error">Informe a chave PIX</div>`; return; }

  const btn = document.getElementById('saque-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Aguarde…';

  const data = await dc({ action: 'request_withdrawal', email: state.user.email, amount: valor, pix_key: chave, pix_type: tipo });

  if (data.error) {
    alert_el.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
    btn.disabled = false; btn.innerHTML = 'Solicitar saque';
    return;
  }

  save_user({ ...state.user, balance: state.user.balance - valor });
  alert_el.innerHTML = `<div class="alert alert-success">✅ Saque solicitado! Processado em até 24h.</div>`;
  document.getElementById('saque-valor').value = '';
  document.getElementById('saque-chave').value = '';
  btn.disabled = false; btn.innerHTML = 'Solicitar saque';
  load_withdrawals();
}

async function load_withdrawals() {
  const data = await dc({ action: 'get_withdrawals', email: state.user.email });
  const el = document.getElementById('saques-list');
  if (!el) return;
  if (!data.withdrawals?.length) { el.innerHTML = '<p class="muted">Nenhum saque ainda</p>'; return; }
  const badge = { pending: 'badge-yellow', approved: 'badge-green', rejected: 'badge-red' };
  const label = { pending: 'Pendente', approved: 'Aprovado', rejected: 'Rejeitado' };
  el.innerHTML = data.withdrawals.map(w => `
    <div class="list-item">
      <div>
        <div>${brl(w.amount)} · ${(w.pix_type || '').toUpperCase()}</div>
        <div class="muted">${fmt_date(w.created_at)}</div>
      </div>
      <span class="badge ${badge[w.status] || 'badge-yellow'}">${label[w.status] || w.status}</span>
    </div>`).join('');
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────

async function render_admin() {
  document.getElementById('app').innerHTML = `
    ${nav_html('admin')}
    <div class="container page">
      <div class="page-header"><h1>🔧 Admin</h1></div>

      <div class="card" style="margin-bottom:12px">
        <h2 style="margin-bottom:14px">🖼️ Gerenciar banners</h2>
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('banner-input').click()">
          <input type="file" id="banner-input" accept="image/*" onchange="preview_banner(event)">
          <div id="upload-placeholder">
            <div style="font-size:2rem;margin-bottom:8px">📁</div>
            <div style="font-weight:700">Clique ou arraste uma imagem</div>
            <p class="muted" style="margin-top:4px;font-size:0.78rem">JPG, PNG ou WEBP · Recomendado 1200×420</p>
          </div>
          <img id="upload-preview" class="upload-preview hidden" src="">
        </div>
        <div class="input-group" style="margin-top:12px">
          <label>Link ao clicar (opcional)</label>
          <input type="url" id="banner-link" placeholder="https://...">
        </div>
        <button class="btn btn-primary" id="upload-btn" onclick="upload_banner()">⬆️ Enviar banner</button>
        <div class="neon-line"></div>
        <h2 style="margin-bottom:10px">Banners ativos</h2>
        <div id="banners-grid"><div class="center" style="padding:20px"><div class="spinner"></div></div></div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:12px">💸 Saques pendentes</h2>
        <div id="admin-withdrawals"><div class="center" style="padding:20px"><div class="spinner"></div></div></div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:12px">📊 Resumo</h2>
        <div id="admin-summary"><div class="center" style="padding:20px"><div class="spinner"></div></div></div>
      </div>
    </div>`;

  load_admin_banners();
  load_admin_data();

  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) handle_banner_file(f); });
}

function preview_banner(e) {
  const file = e.target.files[0];
  if (!file) return;
  handle_banner_file(file);
}

function handle_banner_file(file) {
  window._banner_file = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('upload-preview');
    const placeholder = document.getElementById('upload-placeholder');
    preview.src = e.target.result;
    preview.classList.remove('hidden');
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function upload_banner() {
  if (!window._banner_file) { toast('Selecione uma imagem'); return; }
  const btn = document.getElementById('upload-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando…';

  const link = document.getElementById('banner-link').value.trim();
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    const data = await dc({
      action: 'upload_banner',
      email: state.user.email,
      password: window._admin_pass || '',
      image_base64: base64,
      image_type: window._banner_file.type,
      link: link || null,
    });

    btn.disabled = false; btn.innerHTML = '⬆️ Enviar banner';

    if (data.error) { toast('Erro: ' + data.error); return; }

    toast('Banner enviado! 🎉');
    window._banner_file = null;
    document.getElementById('upload-preview').classList.add('hidden');
    document.getElementById('upload-placeholder').style.display = '';
    document.getElementById('banner-link').value = '';
    document.getElementById('banner-input').value = '';

    await load_banners();
    load_admin_banners();
  };
  reader.readAsDataURL(window._banner_file);
}

async function load_admin_banners() {
  const data = await dc({ action: 'get_banners' });
  const el = document.getElementById('banners-grid');
  if (!el) return;
  const banners = data.banners || [];
  if (!banners.length) { el.innerHTML = '<p class="muted">Nenhum banner ainda</p>'; return; }
  el.innerHTML = `<div class="banner-grid">
    ${banners.map(b => `
      <div class="banner-thumb">
        <img src="${b.url}" alt="Banner">
        <button class="banner-thumb-del" onclick="delete_banner('${b.id}')">✕</button>
      </div>`).join('')}
  </div>`;
}

async function delete_banner(msg_id) {
  if (!confirm('Excluir este banner?')) return;
  const data = await dc({ action: 'delete_banner', email: state.user.email, password: window._admin_pass || '', msg_id });
  if (data.error) { toast('Erro: ' + data.error); return; }
  toast('Banner excluído');
  await load_banners();
  load_admin_banners();
}

async function load_admin_data() {
  const pass = window._admin_pass || prompt('Confirme sua senha de admin:') || '';
  window._admin_pass = pass;

  const data = await dc({ action: 'admin_get_all', email: state.user.email, password: pass });

  if (data.error) {
    document.getElementById('admin-withdrawals').innerHTML = `<div class="alert alert-error">${data.error}</div>`;
    document.getElementById('admin-summary').innerHTML = '';
    return;
  }

  const pending = (data.withdrawals || []).filter(w => w.status === 'pending');
  const el_w = document.getElementById('admin-withdrawals');
  if (!pending.length) { el_w.innerHTML = '<p class="muted">Nenhum saque pendente 🎉</p>'; }
  else {
    el_w.innerHTML = pending.map(w => `
      <div style="border-bottom:1px solid var(--border);padding:14px 0">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <div>
            <div style="font-weight:700">${w.email}</div>
            <div class="muted">${(w.pix_type||'').toUpperCase()}: ${w.pix_key}</div>
            <div class="muted">${fmt_date(w.created_at)}</div>
          </div>
          <div style="font-size:1.1rem;font-weight:900;color:var(--gold)">${brl(w.amount)}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-success btn-sm" onclick="process_withdrawal('${w.msg_id}','${w.email}',${w.amount},'${w.pix_key}','${w.pix_type}')">✅ Pagar via Assas</button>
          <button class="btn btn-danger btn-sm" onclick="reject_withdrawal('${w.msg_id}')">❌ Rejeitar</button>
        </div>
      </div>`).join('');
  }

  const total_users   = (data.users || []).length;
  const active_users  = (data.users || []).filter(u => u.plan).length;
  const total_paid    = (data.payments || []).filter(p => p.status === 'approved').reduce((s, p) => s + (p.plan_price || 0), 0);
  const total_pending = pending.length;

  document.getElementById('admin-summary').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
        <div class="label">Usuários</div>
        <div style="font-size:1.6rem;font-weight:900">${total_users}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
        <div class="label">Ativos</div>
        <div style="font-size:1.6rem;font-weight:900;color:var(--green)">${active_users}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
        <div class="label">Total recebido</div>
        <div style="font-size:1rem;font-weight:900;color:var(--accent2)">${brl(total_paid)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
        <div class="label">Saques pend.</div>
        <div style="font-size:1.6rem;font-weight:900;color:var(--yellow)">${total_pending}</div>
      </div>
    </div>`;
}

async function process_withdrawal(msg_id, email, amount, pix_key, pix_type) {
  const btn = event.target;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const data = await as({ action: 'create_withdrawal_pix', email: state.user.email, password: window._admin_pass, amount, pix_key, pix_type });

  if (data.error) {
    toast('Erro: ' + data.error);
    btn.disabled = false; btn.innerHTML = '✅ Pagar via Assas';
    return;
  }

  await dc({ action: 'admin_update_withdrawal', email: state.user.email, password: window._admin_pass, msg_id, status: 'approved', assas_id: data.transfer_id });
  toast('Saque processado! ✅');
  load_admin_data();
}

async function reject_withdrawal(msg_id) {
  if (!confirm('Rejeitar este saque?')) return;
  await dc({ action: 'admin_update_withdrawal', email: state.user.email, password: window._admin_pass, msg_id, status: 'rejected' });
  toast('Saque rejeitado');
  load_admin_data();
}

// ── INIT ─────────────────────────────────────────────────────────────────────

const ref_param = new URLSearchParams(location.search).get('ref');
if (ref_param) localStorage.setItem('ap_ref', ref_param);

load_banners();
render();
</script>
