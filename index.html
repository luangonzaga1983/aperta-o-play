<style>
:root {
  --radius: 1rem;
  --background: oklch(0.14 0.02 200);
  --foreground: oklch(0.97 0.01 180);
  --card: oklch(0.18 0.025 195);
  --primary: oklch(0.82 0.17 160);
  --primary-foreground: oklch(0.16 0.03 200);
  --secondary: oklch(0.24 0.03 195);
  --muted: oklch(0.22 0.025 195);
  --muted-foreground: oklch(0.72 0.03 190);
  --accent: oklch(0.72 0.22 320);
  --destructive: oklch(0.65 0.22 25);
  --warning: oklch(0.82 0.15 90);
  --border: oklch(0.32 0.05 170);
  --whatsapp: oklch(0.72 0.19 150);
  --glass-fill: color-mix(in oklab, white 12%, transparent);
  --glass-fill-strong: color-mix(in oklab, white 18%, transparent);
  --glass-line: color-mix(in oklab, white 16%, transparent);
  --glass-hi: color-mix(in oklab, white 22%, transparent);
  --gradient-page: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, white 6%, var(--background)) 0%, var(--background) 60%);
  --gradient-story: radial-gradient(circle at 30% 107%, oklch(0.96 0.09 95) 0%, oklch(0.96 0.09 95) 5%, oklch(0.68 0.2 30) 45%, oklch(0.6 0.24 330) 60%, oklch(0.5 0.24 265) 90%);
  --shadow-glow: 0 0 40px -8px color-mix(in oklab, var(--primary) 45%, transparent);
}
* { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--background); color: var(--foreground); font-family: "Outfit", ui-sans-serif, system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.bg-page { min-height: 100vh; background-image: var(--gradient-page); background-color: var(--background); }
.wrap { max-width: 28rem; margin: 0 auto; padding: 1.25rem 1.25rem 7rem; }
.ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
.ic-sm { width: 1rem; height: 1rem; flex-shrink: 0; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; }
.w-full { width: 100%; }

const state = {
  user: JSON.parse(localStorage.getItem('ap_user') || 'null'),
  page: 'home',
  auth_mode: 'login',
  show_pass: false,
  hidden: false,
  paused: false,
  banners: [],
  carousel_idx: 0,
  carousel_timer: null,
  selected_plan: PLANS[0].price,
};

async function api(endpoint, body) {
  const r = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
const dc  = (body) => api(API_DISCORD, body);
const pay = (body) => api(API_ASSAS, body);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const money = (v) => state.hidden ? 'R$ ••••' : brl(v);
const fmt_date = (s) => new Date(s).toLocaleDateString('pt-BR');
const user_name = () => state.user.email.split('@')[0];
const ref_url = (code) => `${location.origin}/?ref=${encodeURIComponent(code)}`;
const mount = (html) => { document.getElementById('app').innerHTML = html; window.scrollTo(0, 0); };

function icon(name, cls = 'ic') {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

function wa_icon(cls = 'ic') {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${WA_PATH}"/></svg>`;
}

function spinner_block() {
  return '<div class="center" style="padding:1.5rem"><span class="spinner lg"></span></div>';
}

function save_user(u) { state.user = u; localStorage.setItem('ap_user', JSON.stringify(u)); }

function logout() {
  state.user = null;
  localStorage.removeItem('ap_user');
  window._admin_pass = '';
  state.page = 'home';
  render();
}

function toast(msg, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function copy_text(t, msg = 'Copiado!') {
  navigator.clipboard.writeText(t).then(() => toast(msg), () => toast('Não foi possível copiar.'));
}

function set_page(p) {
  document.body.classList.remove('menu-open');
  state.page = p;
  render();
}

function toggle_menu(force) {
  document.body.classList.toggle('menu-open', force);
}

function logo_html(size = 40, verified = false) {
  const px = Math.max(14, size * 0.4);
  const check = verified
    ? `<svg class="ring-check" viewBox="0 0 24 24" role="img" aria-label="Afiliado verificado" style="width:${px}px;height:${px}px"><path fill="currentColor" d="M12 1l2.6 1.9 3.2-.2 1 3.1 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3.1-3.2-.2L12 23l-2.6-1.9-3.2.2-1-3.1-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3.1 3.2.2z"/><path d="M7.5 12.3l3 3 6-6.2" fill="none" stroke="var(--background)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    : '';
  return `<span class="ring" style="width:${size}px;height:${size}px"><span class="ring-in"><img src="${LOGO}" alt="Logo do Aperta o Play"></span>${check}</span>`;
}

function premium_html(compact = false) {
  const plan = state.user?.plan;
  if (!plan) return '';
  return `<span class="premium" title="Plano ativo de ${brl(plan)}"><span class="row" style="gap:.25rem">${icon('shield_check', 'ic-sm')}${compact ? 'Premium' : `Premium ativo · ${brl(plan)}`}</span></span>`;
}

function carousel_html() {
  const banners = state.banners;
  const slides = banners.length
    ? banners.map((b, i) => `<div class="slide" data-link="${esc(b.link || '')}" onclick="open_banner(this)"><img src="${esc(b.url)}" alt="Banner ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}"></div>`).join('')
    : `<div class="slide">${logo_html(56)}<p style="font-size:1.125rem;font-weight:700">Aperta o Play</p><p class="tiny" style="font-size:.75rem">Novidades em breve</p></div>`;
  const dots = banners.map((_, i) => `<button class="dot ${i === state.carousel_idx ? 'on' : ''}" onclick="carousel_go(${i})" aria-label="Ver banner ${i + 1}"><span></span></button>`).join('');
  const controls = banners.length > 1
    ? `<div class="car-ctl">
        <button class="btn-ghost-ic" onclick="carousel_prev()" aria-label="Banner anterior">${icon('chev_l')}</button>
        <div class="dots">${dots}</div>
        <div class="row">
          <button class="btn-ghost-ic" onclick="toggle_pause()" aria-label="${state.paused ? 'Continuar banners' : 'Pausar banners'}">${icon(state.paused ? 'play' : 'pause')}</button>
          <button class="btn-ghost-ic" onclick="carousel_next()" aria-label="Próximo banner">${icon('chev_r')}</button>
        </div>
      </div>`
    : '';
  return `<div class="carousel glass"><div class="track" id="carousel-track" style="transform:translateX(-${state.carousel_idx * 100}%)">${slides}</div></div>${controls}`;
}

function open_banner(el) {
  const link = el.dataset.link;
  if (/^https?:\/\//i.test(link)) window.open(link, '_blank', 'noopener');
}

async function load_banners() {
  const data = await dc({ action: 'get_banners' });
  state.banners = data.banners || [];
  state.carousel_idx = Math.min(state.carousel_idx, Math.max(state.banners.length - 1, 0));
  render_carousel_only();
}

function render_carousel_only() {
  const el = document.getElementById('carousel-container');
  if (!el) return;
  el.innerHTML = carousel_html();
  carousel_reset_timer();
}

function carousel_go(idx) {
  if (!state.banners.length) return;
  state.carousel_idx = (idx + state.banners.length) % state.banners.length;
  const track = document.getElementById('carousel-track');
  if (track) track.style.transform = `translateX(-${state.carousel_idx * 100}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === state.carousel_idx));
  carousel_reset_timer();
}

const carousel_next = () => carousel_go(state.carousel_idx + 1);
const carousel_prev = () => carousel_go(state.carousel_idx - 1);

function toggle_pause() {
  state.paused = !state.paused;
  render_carousel_only();
}

function carousel_reset_timer() {
  clearInterval(state.carousel_timer);
  if (state.banners.length < 2 || state.paused) return;
  state.carousel_timer = setInterval(() => { if (!document.hidden) carousel_next(); }, 5000);
}

function open_modal(html, on_close) {
  window._modal_on_close = on_close || null;
  document.getElementById('modal-root').innerHTML = `
    <div class="mask" onclick="close_modal()">

  switch (state.page) {

function toggle_pass() {
  const el = document.getElementById('auth-pass');

  state.show_pass = !state.show_pass;
  render_auth();
  document.getElementById('auth-pass').value = typed;
  document.getElementById('auth-email').value = email;
}

function auth_err(msg) {
  document.getElementById('auth-alert').innerHTML = `<div class="notice err">${esc(msg)}</div>`;
}

async function auth_submit(e, mode) {
  e.preventDefault();
  const email    = document.getElementById('auth-email').value.trim().toLowerCase();
  const password = document.getElementById('auth-pass').value;
  const ref_code = document.getElementById('auth-ref')?.value.trim();

  if (!email || !password) { auth_err('Preencha todos os campos'); return; }

  const btn = document.getElementById('auth-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const data = mode === 'login'
    ? await dc({ action: 'login', email, password })
    : await dc({ action: 'register', email, password, referral_code: ref_code });

  if (data.error) {
    auth_err(data.error);
    btn.disabled = false;
    btn.innerHTML = mode === 'login' ? 'Entrar' : 'Criar conta';
    return;
  }

  save_user(data.user);
  localStorage.removeItem('ap_ref');
  history.replaceState({}, '', '/');
  set_page('painel');
}

async function solicitar_saque(e) {
  e.preventDefault();
  const valor = parseFloat(document.getElementById('saque-valor').value);
  const tipo  = document.getElementById('saque-tipo').value;
  const chave = document.getElementById('saque-chave').value.trim();
  const alert_el = document.getElementById('saque-alert');
  const fail = (msg) => { alert_el.innerHTML = `<div class="notice err">${msg}</div>`; };

  if (!valor || valor <= 0)       { fail('Valor inválido'); return; }
  if (valor > state.user.balance) { fail('Saldo insuficiente'); return; }
  if (!chave)                     { fail('Informe a chave Pix'); return; }

  const btn = document.getElementById('saque-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Aguarde…';

  const data = await dc({ action: 'request_withdrawal', email: state.user.email, amount: valor, pix_key: chave, pix_type: tipo });

  btn.disabled = false;
  btn.innerHTML = 'Solicitar saque';

  if (data.error) { fail(esc(data.error)); return; }

  save_user({ ...state.user, balance: state.user.balance - valor });
  alert_el.innerHTML = '<div class="notice ok">Saque solicitado! Processado em até 24h.</div>';
  document.getElementById('saque-valor').value = '';
  document.getElementById('saque-chave').value = '';
  load_withdrawals();
}

async function load_withdrawals() {
  const data = await dc({ action: 'get_withdrawals', email: state.user.email });
  const el = document.getElementById('saques-list');
  if (!el) return;
  if (!data.withdrawals?.length) { el.innerHTML = '<p class="muted" style="padding:1rem 0;text-align:center">Nenhum saque ainda.</p>'; return; }
  const tone  = { pending: 'yellow', approved: 'green', rejected: 'red' };
  const label = { pending: 'Pendente', approved: 'Aprovado', rejected: 'Rejeitado' };
  el.innerHTML = data.withdrawals.map((w) => `
    <div class="li">
      <span class="avatar-ic">${icon('wallet', 'ic-sm')}</span>
      <div class="grow"><p class="name">${brl(w.amount)} · ${esc((w.pix_type || '').toUpperCase())}</p><p class="tiny">${fmt_date(w.created_at)}</p></div>
      <span class="badge ${tone[w.status] || 'yellow'}">${label[w.status] || esc(w.status)}</span>
    </div>`).join('');
}

          <p class="tiny" style="margin-top:.25rem;font-size:.75rem">JPG, PNG ou WEBP · Recomendado 1280×720</p>
        </div>
        <img id="upload-preview" class="upload-preview hidden" src="" alt="Pré-visualização">
      </div>
      <label class="field">Link ao clicar (opcional)<input type="url" id="banner-link" placeholder="https://..."></label>
      <button class="btn-brand w-full mt-4" id="upload-btn" onclick="upload_banner()">Enviar banner</button>
      <div class="divider"></div>
      <h2>Banners ativos</h2>
      <div id="banners-grid">${spinner_block()}</div>
    </section>
    <section class="card"><h2>Saques pendentes</h2><div id="admin-withdrawals" class="mt-3">${spinner_block()}</div></section>
    <section class="card"><h2>Resumo</h2><div id="admin-summary">${spinner_block()}</div></section>`));

  load_admin_banners();
  load_admin_data();

  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) handle_banner_file(f);
  });
}

function preview_banner(e) {
  const file = e.target.files[0];
  if (file) handle_banner_file(file);
}

function handle_banner_file(file) {
  window._banner_file = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('upload-preview');
    preview.src = e.target.result;
    preview.classList.remove('hidden');
    document.getElementById('upload-placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function upload_banner() {
  if (!window._banner_file) { toast('Selecione uma imagem'); return; }
  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando…';

  const link = document.getElementById('banner-link').value.trim();
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    const data = await dc({
      action: 'upload_banner',
      email: state.user.email,
      password: window._admin_pass || '',
      image_base64: base64,
      image_type: window._banner_file.type,
      link: link || null,
    });

    btn.disabled = false;
    btn.innerHTML = 'Enviar banner';

    if (data.error) { toast('Erro: ' + data.error); return; }

    toast('Banner enviado!');
    window._banner_file = null;
    document.getElementById('upload-preview').classList.add('hidden');
    document.getElementById('upload-placeholder').style.display = '';
    document.getElementById('banner-link').value = '';
    document.getElementById('banner-input').value = '';

    await load_banners();
    load_admin_banners();
  };
  reader.readAsDataURL(window._banner_file);
}

async function load_admin_banners() {
  const data = await dc({ action: 'get_banners' });
  const el = document.getElementById('banners-grid');
  if (!el) return;
  const banners = data.banners || [];
  if (!banners.length) { el.innerHTML = '<p class="muted" style="padding:1rem 0">Nenhum banner ainda.</p>'; return; }
  el.innerHTML = `<div class="banner-grid">${banners.map((b) => `
    <div class="banner-thumb">
      <img src="${esc(b.url)}" alt="Banner">
      <button data-id="${esc(b.id)}" onclick="delete_banner(this)" aria-label="Excluir banner">${icon('trash', 'ic-sm')}</button>
    </div>`).join('')}</div>`;
}

async function delete_banner(btn) {
  if (!confirm('Excluir este banner?')) return;
  const data = await dc({ action: 'delete_banner', email: state.user.email, password: window._admin_pass || '', msg_id: btn.dataset.id });
  if (data.error) { toast('Erro: ' + data.error); return; }
  toast('Banner excluído');
  await load_banners();
  load_admin_banners();
}

function ask_admin_pass() {
  if (window._admin_pass) return Promise.resolve(window._admin_pass);
  return new Promise((resolve) => {
    window._admin_resolve = resolve;
    open_modal(`
      <form onsubmit="admin_pass_submit(event)">
        <h3 class="modal-title">Confirmar acesso</h3>
        <p class="muted mt-2" style="text-align:center">Digite sua senha de administrador para continuar.</p>
        <label class="field">Senha<input type="password" id="admin-pass-input" autocomplete="current-password" required></label>
        <button class="btn-brand w-full mt-5">Confirmar</button>
      </form>`, () => resolve(''));
    setTimeout(() => document.getElementById('admin-pass-input')?.focus(), 50);
  });
}

function admin_pass_submit(e) {
  e.preventDefault();
  const pass = document.getElementById('admin-pass-input').value;
  const resolve = window._admin_resolve;
  window._modal_on_close = null;
  document.getElementById('modal-root').innerHTML = '';
  if (resolve) resolve(pass);
}

function stat_html(label, value, tone) {
  return `<div class="stat"><p class="label">${label}</p><p class="v ${tone || ''}">${value}</p></div>`;
}

async function load_admin_data() {
  const pass = await ask_admin_pass();
  const el_w = document.getElementById('admin-withdrawals');
  const el_s = document.getElementById('admin-summary');
  if (!el_w) return;

  if (!pass) {
    el_w.innerHTML = '<div class="notice err">Senha necessária para carregar os dados.</div><button class="btn-line w-full" onclick="load_admin_data()">Informar senha</button>';
    el_s.innerHTML = '';
    return;
  }

  window._admin_pass = pass;
  const data = await dc({ action: 'admin_get_all', email: state.user.email, password: pass });

  if (data.error) {
    window._admin_pass = '';
    el_w.innerHTML = `<div class="notice err">${esc(data.error)}</div><button class="btn-line w-full" onclick="load_admin_data()">Tentar novamente</button>`;
    el_s.innerHTML = '';
    return;
  }

  const pending = (data.withdrawals || []).filter((w) => w.status === 'pending');
  el_w.innerHTML = pending.length
    ? pending.map((w) => `
      <div style="padding:.875rem 0;border-bottom:1px solid color-mix(in oklab,var(--border) 60%,transparent)">
        <div class="row between" style="align-items:flex-start;gap:.75rem">
          <div style="min-width:0">
            <p class="name" style="font-weight:600;word-break:break-all">${esc(w.email)}</p>
            <p class="tiny" style="word-break:break-all">${esc((w.pix_type || '').toUpperCase())}: ${esc(w.pix_key)}</p>
            <p class="tiny">${fmt_date(w.created_at)}</p>
          </div>
          <p class="text-warn" style="font-size:1.125rem;font-weight:800;white-space:nowrap">${brl(w.amount)}</p>
        </div>
        <div class="row gap-2 mt-3">
          <button class="btn-ok" data-id="${esc(w.msg_id)}" data-amount="${w.amount}" data-key="${esc(w.pix_key)}" data-type="${esc(w.pix_type)}" onclick="process_withdrawal(this)">Pagar via Pix</button>
          <button class="btn-bad" data-id="${esc(w.msg_id)}" onclick="reject_withdrawal(this)">Rejeitar</button>
        </div>
      </div>`).join('')
    : '<p class="muted" style="padding:1rem 0;text-align:center">Nenhum saque pendente.</p>';

  const total_paid = (data.payments || []).filter((p) => p.status === 'approved').reduce((s, p) => s + (p.plan_price || 0), 0);
  el_s.innerHTML = `<div class="stat-grid">
    ${stat_html('Usuários', (data.users || []).length)}
    ${stat_html('Ativos', (data.users || []).filter((u) => u.plan).length, 'text-primary')}
    ${stat_html('Total recebido', brl(total_paid), 'text-accent')}
    ${stat_html('Saques pend.', pending.length, 'text-warn')}
  </div>`;
}

async function process_withdrawal(btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const { id, amount, key, type } = btn.dataset;
  const data = await pay({ action: 'create_withdrawal_pix', email: state.user.email, password: window._admin_pass, amount: Number(amount), pix_key: key, pix_type: type });

  if (data.error) {
    toast('Erro: ' + data.error);
    btn.disabled = false;
    btn.innerHTML = 'Pagar via Pix';
    return;
  }

  await dc({ action: 'admin_update_withdrawal', email: state.user.email, password: window._admin_pass, msg_id: id, status: 'approved', assas_id: data.transfer_id });
  toast('Saque processado!');
  load_admin_data();
}

async function reject_withdrawal(btn) {
  if (!confirm('Rejeitar este saque?')) return;
  await dc({ action: 'admin_update_withdrawal', email: state.user.email, password: window._admin_pass, msg_id: btn.dataset.id, status: 'rejected' });
  toast('Saque rejeitado');
  load_admin_data();
}

const ref_param = new URLSearchParams(location.search).get('ref');
if (ref_param) localStorage.setItem('ap_ref', ref_param.slice(0, 12));
if (ref_param && !state.user) {
  state.page = 'auth';
  state.auth_mode = 'register';
} else if (state.user) {
  state.page = 'painel';
}

render();
</script>
</body>
</html>
