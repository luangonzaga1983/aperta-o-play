const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const id_gt = (a, b) => (a.length !== b.length ? a.length > b.length : a > b);
const id_max = (a, b) => (id_gt(a, b) ? a : b);
const chat = { msgs: [], last: '0', seen: '0', loop: 0, unread: null, more: false, disabled: false };
const staffchat = { running: false, after: '0', unread: 0, retry_at: 0 };
const adm_chat = { cid: null, convs: [], msgs: [], more: false, person: null, user_seen: '0' };
const can_chat = () => !!(state.user && (state.user.is_admin || ['admin', 'support'].includes(state.user.staff_role)));
const fmt_clock = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmt_day = (ms) => new Date(ms).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
const base_title = document.title;

function chat_msgs_html(msgs, mine, seen_id, more_fn) {
  if (!msgs.length) return '<div class="chat-empty">Nenhuma mensagem ainda.<br>Escreva abaixo para começar.</div>';
  let out = more_fn ? `<button class="link-u" style="align-self:center" onclick="${more_fn}">Carregar mensagens anteriores</button>` : '';
  let day = '';
  for (const m of msgs) {
    const d = new Date(m.at).toDateString();
    if (d !== day) { day = d; out += `<div class="chat-day">${esc(fmt_day(m.at))}</div>`; }
    const own = m.from === mine;
    const read = own && !m.pending && !m.failed && seen_id !== '0' && !String(m.id).startsWith('tmp') && !id_gt(m.id, seen_id);
    out += `<div class="msg ${own ? 'me' : 'them'}${m.pending ? ' sending' : ''}${m.failed ? ' failed' : ''}">${esc(m.text)}<small>${m.failed ? 'não enviada' : m.pending ? 'enviando…' : esc(fmt_clock(m.at))}${read ? ' · ✓ visto' : ''}</small></div>`;
  }
  return out;
}

function chat_scroll_paint(box, html, force) {
  if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = html;
  if (force || near) box.scrollTop = box.scrollHeight;
}

function chat_grow(el) { el.style.height = 'auto'; el.style.height = `${Math.min(el.scrollHeight, 112)}px`; }

function chat_alert_user(text) {
  const prefs = notif_prefs();
  if (prefs.sound) play_tone(prefs.tone, prefs.volume);
  notif_alert('Suporte Aperta o Play', text, 'ap-chat');
}

// ----- lado do usuário -----
async function render_support() {
  const gen = ++chat.loop;
  const cfg = await get_cfg();
  const phone = String(cfg?.support_whatsapp || '').replace(/\D/g, '');
  mount(shell('Suporte', `
    <div class="chat-box">
      <div class="chat-top"><span class="sup-ic ap">${icon('chat', 'ic-sm')}</span><div style="flex:1;min-width:0"><b>Suporte Aperta o Play</b><p class="tiny" id="chat-status">Conectando…</p></div><span class="live" id="chat-live"></span></div>
      <div class="chat-msgs" id="chat-msgs">${spinner_block()}</div>
      <form class="chat-form" onsubmit="chat_submit(event)">
        <textarea id="chat-input" rows="1" maxlength="900" placeholder="Escreva sua mensagem…" onkeydown="chat_key(event)" oninput="chat_grow(this)"></textarea>
        <button aria-label="Enviar">${icon('send', 'ic-sm')}</button>
      </form>
    </div>
    ${phone ? `<button class="link-u" style="display:block;margin:1rem auto 0" onclick="support_whatsapp()">Prefere o WhatsApp? Falar por lá</button>` : ''}`));
  const r = await chatapi({ action: 'chat_open' });
  if (gen !== chat.loop) return;
  const box = document.getElementById('chat-msgs');
  if (!box) return;
  if (r.error) {
    box.innerHTML = `<div class="chat-empty">${esc(r.code === 'no_channel' ? 'O chat do aplicativo ainda não foi ativado. Use o WhatsApp.' : r.error)}</div>`;
    document.getElementById('chat-status').textContent = 'Indisponível';
    return;
  }
  chat.msgs = r.messages; chat.last = r.latest || '0'; chat.seen = r.staff_seen || '0'; chat.more = r.more; chat.unread = 0;
  chat_fab_refresh();
  chat_paint(true);
  document.getElementById('chat-input')?.focus();
  chat_loop(gen);
}

function chat_paint(force) {
  chat_scroll_paint(document.getElementById('chat-msgs'), chat_msgs_html(chat.msgs, 'user', chat.seen, chat.more ? 'chat_older()' : ''), force);
}

function chat_set_status(on) {
  const status = document.getElementById('chat-status');
  if (status) status.textContent = on ? 'Ao vivo · respondemos aqui mesmo' : 'Reconectando…';
  document.getElementById('chat-live')?.classList.toggle('on', on);
}

async function chat_older() {
  const first = chat.msgs.find((m) => !String(m.id).startsWith('tmp'));
  if (!first) return;
  const r = await chatapi({ action: 'chat_open', before: first.id });
  if (r.error) { toast(r.error); return; }
  chat.msgs = [...r.messages, ...chat.msgs]; chat.more = r.more;
  const box = document.getElementById('chat-msgs');
  const before = box ? box.scrollHeight : 0;
  chat_paint(false);
  if (box) box.scrollTop = box.scrollHeight - before;
}

async function chat_loop(gen) {
  let fails = 0;
  while (gen === chat.loop && state.page === 'suporte' && state.user) {
    const r = await chatapi({ action: 'chat_poll', after: chat.last, seen: chat.seen, focused: !document.hidden }).catch(() => null);
    if (gen !== chat.loop || state.page !== 'suporte') return;
    if (!r || r.error) {
      if (r?.code === 'auth') return;
      fails++; chat_set_status(false);
      await sleep(Math.min(8000, 1000 * fails));
      continue;
    }
    fails = 0; chat_set_status(true);
    let changed = false;
    for (const m of r.messages) {
      chat.last = id_max(chat.last, m.id);
      if (chat.msgs.some((x) => x.id === m.id)) continue;
      chat.msgs.push(m); changed = true;
      if (m.from === 'staff') chat_alert_user(m.text);
    }
    if (r.staff_seen && r.staff_seen !== chat.seen) { chat.seen = r.staff_seen; changed = true; }
    if (changed) chat_paint(false);
  }
}

function chat_key(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.querySelector('.chat-form')?.requestSubmit(); }
}

async function chat_submit(e) {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; chat_grow(input);
  const draft = { id: `tmp${Date.now()}`, from: 'user', text, at: Date.now(), pending: true };
  chat.msgs.push(draft); chat_paint(true);
  const r = await chatapi({ action: 'chat_send', text });
  if (r.error) { draft.pending = false; draft.failed = true; chat_paint(false); toast(r.error, 4000); return; }
  const at = chat.msgs.indexOf(draft);
  if (chat.msgs.some((x) => x.id === r.message.id)) chat.msgs.splice(at, 1); else chat.msgs[at] = r.message;
  chat_paint(true);
}

// ----- avisos de resposta quando o chat está fechado -----
function chat_fab_refresh() {
  const dot = document.getElementById('fab-dot');
  if (!dot) return;
  const n = chat.unread || 0;
  dot.textContent = n > 9 ? '9+' : String(n);
  dot.classList.toggle('on', n > 0);
}

async function chat_unread_tick() {
  if (!state.user || chat.disabled || state.page === 'suporte') return;
  const r = await chatapi({ action: 'chat_unread' }).catch(() => null);
  if (!r) return;
  if (r.code === 'no_channel') { chat.disabled = true; return; }
  if (r.error) return;
  const first = chat.unread === null;
  const grew = !first && r.unread > chat.unread;
  chat.unread = r.unread;
  chat_fab_refresh();
  if (grew && r.last) {
    if (!document.hidden) toast(`💬 Suporte: ${r.last.text.slice(0, 90)}`, 6000);
    chat_alert_user(r.last.text);
  }
}

function chat_background_start() {
  setTimeout(chat_unread_tick, 4000);
  setInterval(chat_unread_tick, 20000);
  setInterval(() => { if (can_chat() && !staffchat.running && Date.now() >= staffchat.retry_at) staff_chat_run(); }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { chat_unread_tick(); if (document.title !== base_title && !staffchat.unread) document.title = base_title; } });
}

// ----- lado da equipe -----
function staff_badge() {
  const n = staffchat.unread;
  document.querySelectorAll('.js-chat-n').forEach((el) => { el.textContent = n > 99 ? '99+' : n > 9 && el.classList.contains('nbadge') ? '9+' : String(n); el.classList.toggle('on', n > 0); });
  document.title = n > 0 ? `(${n}) ${base_title}` : base_title;
}

function open_admin_home() {
  if (staffchat.unread > 0 && can_chat()) adm.view = 'chats';
  set_page('admin');
}

async function staff_chat_run() {
  if (staffchat.running) return;
  staffchat.running = true;
  const me = state.user?.email;
  try {
    const first = await chatapi({ action: 'staff_inbox' });
    if (first.code === 'no_channel') { staffchat.retry_at = Date.now() + 120000; return; }
    if (first.error) { staffchat.retry_at = Date.now() + 15000; return; }
    staffchat.after = first.latest || '0'; staffchat.unread = first.unread_total; staff_badge();
    if (adm_chat_visible()) { adm_chat.convs = first.conversations; adm_chat_paint_list(); }
    let fails = 0;
    while (state.user && state.user.email === me && can_chat()) {
      const r = await chatapi({ action: 'staff_poll', after: staffchat.after }).catch(() => null);
      if (!r || r.error) {
        if (r?.code === 'auth' || r?.code === 'no_channel') return;
        fails++; await sleep(Math.min(8000, 1000 * fails)); continue;
      }
      fails = 0;
      for (const m of r.messages) staffchat.after = id_max(staffchat.after, m.id);
      staffchat.unread = r.unread_total;
      r.messages.forEach(staff_chat_apply);
      const incoming = r.messages.filter((m) => m.from === 'user');
      if (incoming.length) staff_chat_notify(incoming);
      staff_badge();
    }
  } finally {
    staffchat.running = false;
  }
}

function staff_chat_apply(m) {
  const viewing_thread = adm_chat_visible() && adm_chat.cid === m.cid;
  let conv = adm_chat.convs.find((c) => c.cid === m.cid);
  if (!conv && m.person) { conv = { ...m.person, unread: 0, total: 0, last: m }; adm_chat.convs.unshift(conv); }
  if (conv) {
    const known = conv.last && conv.last.id === m.id;
    if (!known) {
      conv.last = { id: m.id, from: m.from, text: m.text, at: m.at };
      conv.total = (conv.total || 0) + 1;
      if (m.from === 'user' && !(viewing_thread && !document.hidden)) conv.unread = (conv.unread || 0) + 1;
    }
    adm_chat.convs.sort((a, b) => (id_gt(a.last.id, b.last.id) ? -1 : 1));
  }
  if (viewing_thread && !adm_chat.msgs.some((x) => x.id === m.id)) {
    adm_chat.msgs = adm_chat.msgs.filter((x) => !(x.pending && x.text === m.text && x.from === m.from));
    adm_chat.msgs.push({ id: m.id, from: m.from, text: m.text, at: m.at });
    adm_chat_paint_msgs(false);
    if (m.from === 'user' && !document.hidden) adm_chat_mark_seen();
  }
  if (adm_chat_visible()) adm_chat_paint_list();
}

function staff_chat_notify(list) {
  const last = list[list.length - 1];
  const who = last.person?.login || last.person?.name || String(last.person?.email || '').split('@')[0] || 'Usuário';
  const watching = adm_chat_visible() && adm_chat.cid === last.cid && !document.hidden;
  const prefs = notif_prefs();
  if (prefs.sound) play_tone(prefs.tone, prefs.volume);
  if (!watching) toast(`💬 ${who}: ${last.text.slice(0, 80)}`, 6000);
  if (!watching || document.hidden) notif_alert(`Suporte · ${who}`, last.text, 'ap-chat');
}

const adm_chat_visible = () => state.page === 'admin' && adm.view === 'chats' && !!document.getElementById('achat');

async function enable_chat_alerts() {
  if (!('Notification' in window)) { toast('Este navegador não suporta notificações.'); return; }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if (perm !== 'granted') { toast('Permissão negada. Ative nas configurações do navegador.', 4500); return; }
  notif_pref_set('desktop', true);
  toast('Avisos do aparelho ativados.');
  document.getElementById('achat-alerts')?.remove();
}

function adm_chat_paint_list() {
  const box = document.getElementById('achat-list');
  if (!box) return;
  if (!adm_chat.convs.length) { box.innerHTML = '<p class="muted" style="padding:1.25rem;text-align:center">Nenhuma conversa ainda. Quando um usuário escrever no chat, ela aparece aqui na hora.</p>'; return; }
  box.innerHTML = adm_chat.convs.map((c) => {
    const name = c.login || c.name || String(c.email || 'usuário').split('@')[0];
    const preview = `${c.last.from === 'staff' ? 'Você: ' : ''}${c.last.text}`;
    return `<button class="achat-item ${c.cid === adm_chat.cid ? 'on' : ''}" onclick="adm_chat_open('${esc(c.cid)}')">${adm_avatar(c, 40)}<span class="grow"><p style="font-weight:600">${esc(name)}</p><p class="tiny">${esc(preview)}</p></span><span style="text-align:right"><span class="tiny">${esc(fmt_clock(c.last.at))}</span>${c.unread ? `<span class="cbadge on" style="display:flex;margin:.2rem 0 0 auto">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}</span></button>`;
  }).join('');
}

async function adm_chat_load_list() {
  const r = await chatapi({ action: 'staff_inbox' });
  const box = document.getElementById('achat-list');
  if (!box) return;
  if (r.error) { box.innerHTML = `<div class="notice err" style="margin:1rem">${esc(r.code === 'no_channel' ? 'Falta configurar DISCORD_CHANNEL_SUPORTE na Vercel (canal onde as conversas ficam salvas).' : r.error)}</div>`; return; }
  adm_chat.convs = r.conversations;
  staffchat.unread = r.unread_total; staff_badge();
  adm_chat_paint_list();
}

function adm_chat_paint_msgs(force) {
  chat_scroll_paint(document.getElementById('achat-msgs'), chat_msgs_html(adm_chat.msgs, 'staff', adm_chat.user_seen, adm_chat.more ? 'adm_chat_older()' : ''), force);
}

async function adm_chat_open(cid) {
  adm_chat.cid = cid;
  document.getElementById('achat')?.classList.add('open');
  adm_chat_paint_list();
  const pane = document.getElementById('achat-pane');
  if (!pane) return;
  pane.innerHTML = `<div class="chat-box">${spinner_block()}</div>`;

  if (r.error) { pane.innerHTML = `<div class="notice err">${esc(r.error)}</div>`; return; }
  adm_chat.msgs = r.messages; adm_chat.more = r.more; adm_chat.person = r.person; adm_chat.user_seen = r.user_seen || '0';
  const p = r.person;
  const name = p.login || p.name || String(p.email || 'usuário').split('@')[0];

    <div class="chat-box">
      <div class="chat-top">
        <button class="btn-ghost-ic achat-back" onclick="document.getElementById('achat').classList.remove('open')" aria-label="Voltar">${icon('chev_l')}</button>
        ${adm_avatar(p, 40)}
        <div style="flex:1;min-width:0"><b>${esc(name)}</b><p class="tiny" style="overflow:hidden;text-overflow:ellipsis">${esc(p.email || '')}${p.plan ? ` · plano R$ ${esc(p.plan)}` : ' · sem plano'}</p></div>
        ${wa ? `<a class="aff-wa" href="https://wa.me/55${wa.replace(/^55/, '')}" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp">${wa_icon('ic-sm')}</a>` : ''}
        ${p.email ? `<button class="btn-line rect" style="padding:.35rem .75rem" data-e="${esc(p.email)}" onclick="adm_open_user(this.dataset.e)">Perfil</button>` : ''}

async function adm_chat_older() {
  const first = adm_chat.msgs.find((m) => !String(m.id).startsWith('tmp'));
  if (!first) return;
  const r = await chatapi({ action: 'staff_thread', cid: adm_chat.cid, before: first.id });
  if (r.error) { toast(r.error); return; }
  adm_chat.msgs = [...r.messages, ...adm_chat.msgs]; adm_chat.more = r.more;
  const box = document.getElementById('achat-msgs');
  const before = box ? box.scrollHeight : 0;
  adm_chat_paint_msgs(false);
  if (box) box.scrollTop = box.scrollHeight - before;
}

async function adm_chat_mark_seen() {
  const cid = adm_chat.cid;
  const last = [...adm_chat.msgs].reverse().find((m) => !String(m.id).startsWith('tmp'));
  const conv = adm_chat.convs.find((c) => c.cid === cid);
  if (conv && conv.unread) { conv.unread = 0; adm_chat_paint_list(); }
  if (!last) return;
  const r = await chatapi({ action: 'staff_seen', cid, upto: last.id });
  if (!r.error) { staffchat.unread = r.unread_total; staff_badge(); }
}

function adm_chat_key(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.closest('form').requestSubmit(); }
}

async function adm_chat_submit(e) {
  e.preventDefault();
  const input = document.getElementById('achat-input');
  const text = input.value.trim();
  if (!text) return;
  const cid = adm_chat.cid;
  input.value = ''; chat_grow(input);
  const draft = { id: `tmp${Date.now()}`, from: 'staff', text, at: Date.now(), pending: true };
  adm_chat.msgs.push(draft); adm_chat_paint_msgs(true);
  const r = await chatapi({ action: 'staff_send', cid, text });
  if (r.error) { draft.pending = false; draft.failed = true; adm_chat_paint_msgs(false); toast(r.error, 4000); return; }
  if (adm_chat.cid !== cid) return;
  const at = adm_chat.msgs.indexOf(draft);
  if (at < 0) return;
  if (adm_chat.msgs.some((x) => x.id === r.message.id)) adm_chat.msgs.splice(at, 1); else adm_chat.msgs[at] = r.message;
  adm_chat_paint_msgs(true);
  const conv = adm_chat.convs.find((c) => c.cid === cid);
  if (conv) { conv.last = r.message; adm_chat.convs.sort((a, b) => (id_gt(a.last.id, b.last.id) ? -1 : 1)); adm_chat_paint_list(); }
}

function adm_chat_with(cid) { adm_chat.cid = cid; adm_go('chats'); }

function theme_vars(i) {

  return {

    '--muted': `oklch(0.22 0.025 ${b})`,
    '--border': `oklch(0.3 0.05 ${wrap(b - 20)})`,
    '--primary': `oklch(0.85 0.19 ${h})`,
    '--primary-foreground': `oklch(0.16 0.03 ${b})`,
    '--accent': `oklch(0.72 0.24 ${a})`,
    '--gradient-brand': `linear-gradient(135deg, oklch(0.89 0.19 ${wrap(h - 8)}) 0%, oklch(0.81 0.17 ${wrap(h + 24)}) 55%, oklch(0.73 0.16 ${wrap(h + 57)}) 100%)`,
    '--gradient-hot': `linear-gradient(135deg, oklch(0.76 0.23 ${wrap(a + 5)}), oklch(0.68 0.21 ${wrap(a - 40)}))`,
    '--gradient-page': `radial-gradient(90% 46% at 12% -6%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 62%), radial-gradient(70% 42% at 104% 6%, color-mix(in oklab, var(--accent) 17%, transparent), transparent 64%), radial-gradient(90% 50% at 50% 112%, color-mix(in oklab, oklch(0.7 0.17 ${wrap(h + 57)}) 14%, transparent), transparent 62%)`,
    '--shadow-glow': '0 0 44px -10px color-mix(in oklab, var(--primary) 60%, transparent)',
  };
}
function theme_current() {
  const n = Number(localStorage.getItem(THEME_KEY));
  return Number.isInteger(n) && n > 0 && n < PALETTES.length ? n : 0;
}
function theme_apply(i) {
  const root = document.documentElement;
  const vars = theme_vars(i);
  for (const k of Object.keys(vars)) i === 0 ? root.style.removeProperty(k) : root.style.setProperty(k, vars[k]);
  try {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      if (i === 0) meta.setAttribute('content', '#04110d');
      else {
        const c = document.createElement('canvas').getContext('2d');
        c.fillStyle = '#000'; c.fillStyle = vars['--background']; c.fillRect(0, 0, 1, 1);
        const [r, g, bl] = c.getImageData(0, 0, 1, 1).data;
        meta.setAttribute('content', '#' + [r, g, bl].map((v) => v.toString(16).padStart(2, '0')).join(''));
      }
    }
  } catch {}
}
function theme_pick(i) {
  try { i === 0 ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY, String(i)); } catch {}
  theme_apply(i);
  if (document.getElementById('theme-root')) theme_open();
}
function theme_close() { const el = document.getElementById('theme-root'); if (el) el.remove(); }
function theme_open() {
  const scroll = document.querySelector('#theme-root .theme-grid')?.scrollTop || 0;
  theme_close();
  const cur = theme_current();
  const cards = PALETTES.map(([name, h, a, b], i) => `
    <button class="theme-opt ${i === cur ? 'on' : ''}" onclick="theme_pick(${i})" aria-label="Paleta ${name}">
      <div class="theme-prev" style="background:oklch(0.12 0.028 ${b})"><i></i><span class="dot" style="background:oklch(0.72 0.24 ${a})"></span>
        <div class="bar"><span class="p1" style="background:oklch(0.85 0.19 ${h})"></span><span class="p2" style="background:oklch(0.72 0.24 ${a})"></span></div></div>
      <span>${name}<em class="ck">${icon('check', 'ic-sm')}</em></span>
    </button>`).join('');
  const root = document.createElement('div');
  root.id = 'theme-root';
  root.innerHTML = `
    <div class="theme-mask" onclick="theme_close()"></div>
    <div class="theme-panel" role="dialog" aria-label="Cores do aplicativo">
      <div class="theme-head"><div><b>Cores do aplicativo</b><small>Escolha uma das ${PALETTES.length} paletas</small></div><span class="theme-chip">${PALETTES[cur][0]}</span></div>
      <div class="theme-grid">${cards}</div>
      <div class="theme-foot"><button onclick="theme_pick(0)">Voltar às cores originais</button></div>
    </div>`;
  document.body.appendChild(root);
  const grid = root.querySelector('.theme-grid');
  if (scroll) grid.scrollTop = scroll; else root.querySelector('.theme-opt.on')?.scrollIntoView({ block: 'center' });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') theme_close(); });
theme_apply(theme_current());

capture_first_touch();
if (path_promo) {
  state.promo = { id: path_promo[1], code: String(path_promo[2] || '').toUpperCase() };
  state.page = 'promo';
  state.auth_mode = 'register';
} else if (ref_param && !state.user) {
  state.page = 'invite';
  state.auth_mode = 'register';
} else if (state.user) {
  state.page = 'painel';
}

render();
notif_start();
chat_background_start();
</script>
</body>
</html>
